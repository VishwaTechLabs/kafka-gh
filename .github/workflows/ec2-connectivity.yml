            "" \
            "PRODUCER INPUT" \
            "$MESSAGE_KEY:$PRODUCER_MESSAGE" \
            "" \
            "JOB STATUS" \
            "$JOB_STATUS" \
            > "$REPORT"


          echo ""

          echo "Dashboard generated successfully."

          echo "REPORT_FILE=$REPORT"


      # ============================================================
      # 11 - UPLOAD REPORT
      # ============================================================

      - name: "11 - Upload Report"
        id: upload_report

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: kafka-end-to-end-report

          path: kafka-end-to-end-report.txt

          retention-days: 30

          if-no-files-found: error
