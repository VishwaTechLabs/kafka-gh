name: Kafka End-to-End CI/CD

on:
  workflow_dispatch:
    inputs:

      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - production

      topic_name:
        description: "Kafka topic name"
        required: true
        type: string

      partitions:
        description: "Number of partitions"
        required: true
        type: string
        default: "3"

      replication_factor:
        description: "Replication factor"
        required: true
        type: string
        default: "2"

      message_key:
        description: "Producer message key"
        required: true
        type: string
        default: "github-actions"

      producer_message:
        description: "Message to produce"
        required: true
        type: string
        default: "Hello from GitHub Actions Kafka CI/CD"

      consumer_timeout:
        description: "Consumer timeout in seconds"
        required: true
        type: string
        default: "30"

permissions:
  contents: read

jobs:

  kafka-cicd:

    name: Kafka End-to-End CI/CD

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 01 - VALIDATE INPUTS
      # ============================================================

      - name: "01 - Validate Inputs"

        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TOPIC_NAME: ${{ inputs.topic_name }}
          PARTITIONS: ${{ inputs.partitions }}
          REPLICATION_FACTOR: ${{ inputs.replication_factor }}
          MESSAGE_KEY: ${{ inputs.message_key }}
          PRODUCER_MESSAGE: ${{ inputs.producer_message }}
          CONSUMER_TIMEOUT: ${{ inputs.consumer_timeout }}

        run: |

          echo "=================================================="
          echo "01 - KAFKA CI/CD INPUT VALIDATION"
          echo "=================================================="

          echo ""
          echo "Environment:"
          echo "$ENVIRONMENT"

          echo ""
          echo "Topic Name:"
          echo "$TOPIC_NAME"

          echo ""
          echo "Partitions:"
          echo "$PARTITIONS"

          echo ""
          echo "Replication Factor:"
          echo "$REPLICATION_FACTOR"

          echo ""
          echo "Message Key:"
          echo "$MESSAGE_KEY"

          echo ""
          echo "Producer Message:"
          echo "$PRODUCER_MESSAGE"

          echo ""
          echo "Consumer Timeout:"
          echo "$CONSUMER_TIMEOUT seconds"

          # --------------------------------------------------------
          # Topic validation
          # --------------------------------------------------------

          if [ -z "$TOPIC_NAME" ]; then
            echo "ERROR: Topic name cannot be empty."
            exit 1
          fi

          if [ ${#TOPIC_NAME} -gt 249 ]; then
            echo "ERROR: Topic name is too long."
            exit 1
          fi

          if ! echo "$TOPIC_NAME" | grep -Eq '^[a-zA-Z0-9._-]+$'; then
            echo "ERROR: Invalid topic name."
            exit 1
          fi

          # --------------------------------------------------------
          # Partitions validation
          # --------------------------------------------------------

          if ! [[ "$PARTITIONS" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Partitions must be numeric."
            exit 1
          fi

          if [ "$PARTITIONS" -lt 1 ]; then
            echo "ERROR: Partitions must be greater than 0."
            exit 1
          fi

          # --------------------------------------------------------
          # Replication validation
          # --------------------------------------------------------

          if ! [[ "$REPLICATION_FACTOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Replication factor must be numeric."
            exit 1
          fi

          if [ "$REPLICATION_FACTOR" -lt 1 ]; then
            echo "ERROR: Replication factor must be greater than 0."
            exit 1
          fi

          # Current cluster has 2 brokers

          if [ "$REPLICATION_FACTOR" -gt 2 ]; then
            echo ""
            echo "ERROR: Current Kafka cluster has only 2 brokers."
            echo "Maximum replication factor is 2."
            exit 1
          fi

          # --------------------------------------------------------
          # Consumer timeout validation
          # --------------------------------------------------------

          if ! [[ "$CONSUMER_TIMEOUT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Consumer timeout must be numeric."
            exit 1
          fi

          if [ "$CONSUMER_TIMEOUT" -lt 5 ]; then
            echo "ERROR: Consumer timeout should be at least 5 seconds."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "INPUT VALIDATION PASSED"
          echo "=================================================="


      # ============================================================
      # 02 - KAFKA HEALTH CHECK
      # ============================================================

      - name: "02 - Kafka Health Check"

        id: kafka_health

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            echo "=================================================="
            echo "02 - KAFKA HEALTH CHECK"
            echo "=================================================="

            KAFKA_HOME="/home/ec2-user/kafka"
            KAFKA_BIN="$KAFKA_HOME/bin"
            BOOTSTRAP_SERVER="172.31.36.36:9092"

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "User:"
            whoami

            echo ""
            echo "Private IP:"
            hostname -i

            echo ""
            echo "Kafka Home:"
            echo "$KAFKA_HOME"

            # --------------------------------------------------------
            # Kafka CLI
            # --------------------------------------------------------

            echo ""
            echo "Kafka CLI:"

            if [ -f "$KAFKA_BIN/kafka-topics.sh" ]; then
              echo "KAFKA_CLI_STATUS=PASS"
            else
              echo "KAFKA_CLI_STATUS=FAIL"
              exit 1
            fi

            # --------------------------------------------------------
            # Kafka process
            # --------------------------------------------------------

            echo ""
            echo "Kafka Process:"

            KAFKA_PROCESS=$(pgrep -af "kafka.Kafka" | head -1 || true)

            if [ -n "$KAFKA_PROCESS" ]; then

              echo "KAFKA_PROCESS_STATUS=RUNNING"
              echo "$KAFKA_PROCESS"

            else

              echo "KAFKA_PROCESS_STATUS=NOT_RUNNING"
              exit 1

            fi

            # --------------------------------------------------------
            # Port 9092
            # --------------------------------------------------------

            echo ""
            echo "Port 9092:"

            if ss -lnt | grep -q ':9092 '; then
              echo "PORT_9092_STATUS=LISTENING"
            else
              echo "PORT_9092_STATUS=NOT_LISTENING"
              exit 1
            fi

            # --------------------------------------------------------
            # Port 19092
            # --------------------------------------------------------

            echo ""
            echo "Port 19092:"

            if ss -lnt | grep -q ':19092 '; then
              echo "PORT_19092_STATUS=LISTENING"
            else
              echo "PORT_19092_STATUS=NOT_LISTENING"
              exit 1
            fi

            # --------------------------------------------------------
            # Kafka connectivity
            # --------------------------------------------------------

            echo ""
            echo "Kafka Connectivity:"

            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --list > /tmp/kafka-topics.txt 2>&1

            KAFKA_EXIT=$?

            if [ "$KAFKA_EXIT" -eq 0 ]; then
              echo "KAFKA_CONNECTIVITY_STATUS=SUCCESS"
            else
              echo "KAFKA_CONNECTIVITY_STATUS=FAILED"
              cat /tmp/kafka-topics.txt
              exit 1
            fi

            echo ""
            echo "KAFKA_HEALTH_STATUS=PASS"


      # ============================================================
      # 03 - CREATE TOPIC
      # ============================================================

      - name: "03 - Create Topic"

        id: create_topic

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            echo "=================================================="
            echo "03 - CREATE KAFKA TOPIC"
            echo "=================================================="

            KAFKA_HOME="/home/ec2-user/kafka"
            KAFKA_BIN="$KAFKA_HOME/bin"
            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"
            PARTITIONS="${{ inputs.partitions }}"
            REPLICATION_FACTOR="${{ inputs.replication_factor }}"
            ENVIRONMENT="${{ inputs.environment }}"

            echo ""
            echo "Environment:"
            echo "$ENVIRONMENT"

            echo ""
            echo "Topic:"
            echo "$TOPIC_NAME"

            echo ""
            echo "Partitions:"
            echo "$PARTITIONS"

            echo ""
            echo "Replication Factor:"
            echo "$REPLICATION_FACTOR"

            EXISTING_TOPICS=$(
              "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --list
            )

            if echo "$EXISTING_TOPICS" | grep -Fxq "$TOPIC_NAME"; then

              echo ""
              echo "TOPIC_STATUS=ALREADY_EXISTS"

            else

              echo ""
              echo "Creating topic..."

              CREATE_OUTPUT=$(
                "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --create \
                --topic "$TOPIC_NAME" \
                --partitions "$PARTITIONS" \
                --replication-factor "$REPLICATION_FACTOR" \
                2>&1
              )

              CREATE_EXIT=$?

              echo "$CREATE_OUTPUT"

              if [ "$CREATE_EXIT" -eq 0 ]; then
                echo "TOPIC_STATUS=CREATED"
              else
                echo "TOPIC_STATUS=CREATE_FAILED"
                exit 1
              fi

            fi


      # ============================================================
      # 04 - VERIFY TOPIC
      # ============================================================

      - name: "04 - Verify Topic"

        id: verify_topic

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          script: |

            echo "=================================================="
            echo "04 - VERIFY TOPIC"
            echo "=================================================="

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            VERIFY_TOPIC=$(
              "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --list |
              grep -Fx "$TOPIC_NAME" || true
            )

            if [ "$VERIFY_TOPIC" = "$TOPIC_NAME" ]; then

              echo "TOPIC_VERIFY_STATUS=SUCCESS"

              echo ""
              echo "Verified Topic:"
              echo "$VERIFY_TOPIC"

            else

              echo "TOPIC_VERIFY_STATUS=FAILED"

              exit 1

            fi


      # ============================================================
      # 05 - START CONSUMER
      # ============================================================

      - name: "05 - Start Consumer"

        id: consumer

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            echo "=================================================="
            echo "05 - START KAFKA CONSUMER"
            echo "=================================================="

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            CONSUMER_TIMEOUT="${{ inputs.consumer_timeout }}"

            CONSUMER_GROUP="github-actions-${GITHUB_RUN_ID}"

            echo ""
            echo "Topic:"
            echo "$TOPIC_NAME"

            echo ""
            echo "Consumer Group:"
            echo "$CONSUMER_GROUP"

            echo ""
            echo "Consumer Timeout:"
            echo "$CONSUMER_TIMEOUT seconds"

            rm -f /tmp/kafka-consumer-output.txt

            echo ""
            echo "Starting temporary consumer..."

            timeout "${CONSUMER_TIMEOUT}s" \
              "$KAFKA_BIN/kafka-console-consumer.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --topic "$TOPIC_NAME" \
              --group "$CONSUMER_GROUP" \
              --from-beginning \
              > /tmp/kafka-consumer-output.txt 2>&1 &

            CONSUMER_PID=$!

            echo "CONSUMER_PID=$CONSUMER_PID"

            # Give consumer time to join group

            sleep 5

            echo "CONSUMER_STATUS=STARTED"


      # ============================================================
      # 06 - PRODUCE MESSAGE
      # ============================================================

      - name: "06 - Produce Message"

        id: producer

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            echo "=================================================="
            echo "06 - KAFKA PRODUCER"
            echo "=================================================="

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            MESSAGE_KEY="${{ inputs.message_key }}"

            PRODUCER_MESSAGE="${{ inputs.producer_message }}"

            echo ""
            echo "Topic:"
            echo "$TOPIC_NAME"

            echo ""
            echo "Message Key:"
            echo "$MESSAGE_KEY"

            echo ""
            echo "Producer Message:"
            echo "$PRODUCER_MESSAGE"

            echo ""

            if printf '%s\n' "$PRODUCER_MESSAGE" |
              "$KAFKA_BIN/kafka-console-producer.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --topic "$TOPIC_NAME" \
              --property "parse.key=true" \
              --property "key.separator=:"
            then

              echo ""
              echo "PRODUCER_STATUS=SUCCESS"

            else

              echo ""
              echo "PRODUCER_STATUS=FAILED"

              exit 1

            fi

            echo ""
            echo "Message produced successfully."


      # ============================================================
      # 07 - VERIFY CONSUMER MESSAGE
      # ============================================================

      - name: "07 - Verify Consumer Message"

        id: verify_consumer

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          script: |

            echo "=================================================="
            echo "07 - VERIFY CONSUMER MESSAGE"
            echo "=================================================="

            TOPIC_NAME="${{ inputs.topic_name }}"

            PRODUCER_MESSAGE="${{ inputs.producer_message }}"

            echo ""
            echo "Expected Message:"
            echo "$PRODUCER_MESSAGE"

            echo ""
            echo "Waiting for consumer..."

            sleep 5

            if [ -f /tmp/kafka-consumer-output.txt ]; then

              echo ""
              echo "Consumer Output:"
              echo "--------------------------------------------------"

              cat /tmp/kafka-consumer-output.txt

              echo "--------------------------------------------------"

            else

              echo ""
              echo "ERROR: Consumer output file not found."

              exit 1

            fi

            if grep -Fq "$PRODUCER_MESSAGE" /tmp/kafka-consumer-output.txt; then

              echo ""
              echo "CONSUMER_STATUS=SUCCESS"

              echo "MESSAGE_VERIFICATION=SUCCESS"

              echo ""
              echo "Message received successfully."

            else

              echo ""
              echo "CONSUMER_STATUS=FAILED"

              echo "MESSAGE_VERIFICATION=FAILED"

              echo ""
              echo "Expected message was not received."

              exit 1

            fi


      # ============================================================
      # 08 - LIST TOPICS
      # ============================================================

      - name: "08 - List Topics"

        id: list_topics

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            echo "=================================================="
            echo "08 - ALL KAFKA TOPICS"
            echo "=================================================="

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            ALL_TOPICS=$(
              "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --list
            )

            echo ""

            echo "INDIVIDUAL TOPICS:"
            echo "--------------------------------------------------"

            while IFS= read -r topic
            do

              if [ -n "$topic" ]; then
                echo "TOPIC: $topic"
              fi

            done <<< "$ALL_TOPICS"

            TOPIC_COUNT=$(
              echo "$ALL_TOPICS" |
              sed '/^[[:space:]]*$/d' |
              wc -l
            )

            echo ""

            echo "TOTAL_TOPIC_COUNT=$TOPIC_COUNT"


      # ============================================================
      # 09 - TOPIC DETAILS
      # ============================================================

      - name: "09 - Topic Details"

        id: topic_details

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            echo "=================================================="
            echo "09 - TOPIC DETAILS"
            echo "=================================================="

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            echo ""
            echo "Topic:"
            echo "$TOPIC_NAME"

            echo ""

            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --describe \
              --topic "$TOPIC_NAME"


      # ============================================================
      # 10 - GITHUB DASHBOARD
      # ============================================================

      - name: "10 - GitHub Dashboard"

        if: always()

        env:

          ENVIRONMENT: ${{ inputs.environment }}

          TOPIC_NAME: ${{ inputs.topic_name }}

          PARTITIONS: ${{ inputs.partitions }}

          REPLICATION_FACTOR: ${{ inputs.replication_factor }}

          MESSAGE_KEY: ${{ inputs.message_key }}

          PRODUCER_MESSAGE: ${{ inputs.producer_message }}

          CONSUMER_TIMEOUT: ${{ inputs.consumer_timeout }}

          HEALTH_OUTPUT: ${{ steps.kafka_health.outputs.stdout }}

          PRODUCER_OUTPUT: ${{ steps.producer.outputs.stdout }}

          CONSUMER_OUTPUT: ${{ steps.verify_consumer.outputs.stdout }}

          TOPICS_OUTPUT: ${{ steps.list_topics.outputs.stdout }}

          DETAILS_OUTPUT: ${{ steps.topic_details.outputs.stdout }}

        run: |

          echo "# 🚀 Kafka End-to-End CI/CD Dashboard" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🎯 Runtime Parameters" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | **$ENVIRONMENT** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Topic | **\`$TOPIC_NAME\`** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Partitions | **$PARTITIONS** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Replication Factor | **$REPLICATION_FACTOR** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Message Key | **\`$MESSAGE_KEY\`** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Producer Message | **\`$PRODUCER_MESSAGE\`** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Consumer Timeout | **$CONSUMER_TIMEOUT seconds** |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # PIPELINE STATUS
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🏃 Pipeline Stages" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| # | Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---|---|" >> "$GITHUB_STEP_SUMMARY"

          echo "| 01 | Validate Inputs | 🟢 PASSED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 02 | Kafka Health Check | 🟢 PASSED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 03 | Create Topic | 🟢 COMPLETED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 04 | Verify Topic | 🟢 COMPLETED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 05 | Start Consumer | 🟢 STARTED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 06 | Produce Message | 🟢 SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 07 | Verify Consumer Message | 🟢 SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 08 | List Topics | 🟢 COMPLETED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 09 | Topic Details | 🟢 COMPLETED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 10 | GitHub Dashboard | 🟢 COMPLETED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 11 | Upload Report | 🟢 COMPLETED |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # PRODUCER / CONSUMER
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📨 Producer → Consumer Test" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Test | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Producer | 🟢 SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Consumer | 🟢 SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Message Verification | 🟢 SUCCESS |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Message:** \`$PRODUCER_MESSAGE\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # TOPIC LIST
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📊 Kafka Topics" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"

          echo "$TOPICS_OUTPUT" |
          grep '^TOPIC: ' >> "$GITHUB_STEP_SUMMARY" || true

          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          TOPIC_COUNT=$(echo "$TOPICS_OUTPUT" |
            grep "^TOTAL_TOPIC_COUNT=" |
            cut -d= -f2)

          echo "**Total Topics: $TOPIC_COUNT**" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # TOPIC DETAILS
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🔍 Topic Details" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"

          echo "$DETAILS_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # ARCHITECTURE
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🏗️ Kafka CI/CD Architecture" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          echo '                    DEVELOPER' >> "$GITHUB_STEP_SUMMARY"
          echo '                        |' >> "$GITHUB_STEP_SUMMARY"
          echo '                        v' >> "$GITHUB_STEP_SUMMARY"
          echo '                 GITHUB REPOSITORY' >> "$GITHUB_STEP_SUMMARY"
          echo '                        |' >> "$GITHUB_STEP_SUMMARY"
          echo '                        v' >> "$GITHUB_STEP_SUMMARY"
          echo '                  GITHUB ACTIONS' >> "$GITHUB_STEP_SUMMARY"
          echo '                        |' >> "$GITHUB_STEP_SUMMARY"
          echo '              +---------+----------+' >> "$GITHUB_STEP_SUMMARY"
          echo '              |                    |' >> "$GITHUB_STEP_SUMMARY"
          echo '              v                    v' >> "$GITHUB_STEP_SUMMARY"
          echo '        VALIDATE INPUTS       SSH :22' >> "$GITHUB_STEP_SUMMARY"
          echo '                                   |' >> "$GITHUB_STEP_SUMMARY"
          echo '                                   v' >> "$GITHUB_STEP_SUMMARY"
          echo '                           AWS EC2 BROKER 1' >> "$GITHUB_STEP_SUMMARY"
          echo '                           172.31.36.36' >> "$GITHUB_STEP_SUMMARY"
          echo '                                   |' >> "$GITHUB_STEP_SUMMARY"
          echo '                                   v' >> "$GITHUB_STEP_SUMMARY"
          echo '                            KAFKA :9092' >> "$GITHUB_STEP_SUMMARY"
          echo '                                   |' >> "$GITHUB_STEP_SUMMARY"
          echo '                                   v' >> "$GITHUB_STEP_SUMMARY"
          echo '                            KRaft Cluster' >> "$GITHUB_STEP_SUMMARY"
          echo '                              /        \' >> "$GITHUB_STEP_SUMMARY"
