name: Kafka End-to-End CI/CD

on:
  workflow_dispatch:

    inputs:

      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - production

      topic_name:
        description: "Kafka topic name"
        required: true
        type: string

      partitions:
        description: "Number of partitions"
        required: true
        type: string
        default: "3"

      replication_factor:
        description: "Replication factor"
        required: true
        type: string
        default: "2"

      message_key:
        description: "Producer message key"
        required: true
        type: string
        default: "github-actions"

      producer_message:
        description: "Message to produce"
        required: true
        type: string
        default: "Hello from GitHub Actions Kafka CI/CD"

      consumer_timeout:
        description: "Consumer timeout in seconds"
        required: true
        type: string
        default: "30"


permissions:
  contents: read


# ================================================================
# JOBS
# ================================================================

jobs:


  # ================================================================
  # 01 - VALIDATE INPUTS
  # ================================================================

  validate:

    name: "01 - Validate Inputs"

    runs-on: ubuntu-latest

    steps:

      - name: Validate Kafka CI/CD Inputs

        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TOPIC_NAME: ${{ inputs.topic_name }}
          PARTITIONS: ${{ inputs.partitions }}
          REPLICATION_FACTOR: ${{ inputs.replication_factor }}
          MESSAGE_KEY: ${{ inputs.message_key }}
          PRODUCER_MESSAGE: ${{ inputs.producer_message }}
          CONSUMER_TIMEOUT: ${{ inputs.consumer_timeout }}

        run: |

          set -e

          echo "=================================================="
          echo "01 - KAFKA CI/CD INPUT VALIDATION"
          echo "=================================================="

          echo ""
          echo "Environment        : $ENVIRONMENT"
          echo "Topic Name         : $TOPIC_NAME"
          echo "Partitions         : $PARTITIONS"
          echo "Replication Factor : $REPLICATION_FACTOR"
          echo "Message Key        : $MESSAGE_KEY"
          echo "Producer Message   : $PRODUCER_MESSAGE"
          echo "Consumer Timeout   : $CONSUMER_TIMEOUT seconds"

          echo ""
          echo "Validating topic..."

          if [ -z "$TOPIC_NAME" ]; then
            echo "ERROR: Topic name cannot be empty."
            exit 1
          fi

          if [ "${#TOPIC_NAME}" -gt 249 ]; then
            echo "ERROR: Topic name is too long."
            exit 1
          fi

          if ! echo "$TOPIC_NAME" | grep -Eq '^[a-zA-Z0-9._-]+$'; then
            echo "ERROR: Invalid topic name."
            echo "Allowed: a-z A-Z 0-9 . _ -"
            exit 1
          fi

          echo ""
          echo "Validating partitions..."

          if ! [[ "$PARTITIONS" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Partitions must be numeric."
            exit 1
          fi

          if [ "$PARTITIONS" -lt 1 ]; then
            echo "ERROR: Partitions must be greater than zero."
            exit 1
          fi

          echo ""
          echo "Validating replication factor..."

          if ! [[ "$REPLICATION_FACTOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Replication factor must be numeric."
            exit 1
          fi

          if [ "$REPLICATION_FACTOR" -lt 1 ]; then
            echo "ERROR: Replication factor must be greater than zero."
            exit 1
          fi

          # Current Kafka lab has two brokers.
          if [ "$REPLICATION_FACTOR" -gt 2 ]; then
            echo "ERROR: Current Kafka lab has 2 brokers."
            echo "Maximum replication factor is 2."
            exit 1
          fi

          echo ""
          echo "Validating consumer timeout..."

          if ! [[ "$CONSUMER_TIMEOUT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Consumer timeout must be numeric."
            exit 1
          fi

          if [ "$CONSUMER_TIMEOUT" -lt 5 ]; then
            echo "ERROR: Consumer timeout must be at least 5 seconds."
            exit 1
          fi

          echo ""
          echo "Validating message key..."

          if [ -z "$MESSAGE_KEY" ]; then
            echo "ERROR: Message key cannot be empty."
            exit 1
          fi

          echo ""
          echo "Validating producer message..."

          if [ -z "$PRODUCER_MESSAGE" ]; then
            echo "ERROR: Producer message cannot be empty."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "INPUT_VALIDATION_STATUS=PASS"
          echo "=================================================="


  # ================================================================
  # 02 - KAFKA HEALTH CHECK
  # ================================================================

  kafka-health:

    name: "02 - Kafka Health Check"

    needs: validate

    runs-on: ubuntu-latest

    steps:

      - name: Kafka Health Check

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_HOME="/home/ec2-user/kafka"

            KAFKA_BIN="$KAFKA_HOME/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"


            echo "=================================================="

            echo "02 - KAFKA HEALTH CHECK"

            echo "=================================================="


            echo ""

            echo "Hostname:"

            hostname


            echo ""

            echo "User:"

            whoami


            echo ""

            echo "Private IP:"

            hostname -i


            echo ""

            echo "Kafka Home:"

            echo "$KAFKA_HOME"


            echo ""

            echo "Checking Kafka CLI..."


            if [ ! -f "$KAFKA_BIN/kafka-topics.sh" ]; then

              echo "KAFKA_CLI_STATUS=FAILED"

              exit 1

            fi


            echo "KAFKA_CLI_STATUS=PASS"


            echo ""

            echo "Checking Kafka process..."


            if pgrep -af "kafka.Kafka" | grep -v pgrep >/dev/null; then

              echo "KAFKA_PROCESS_STATUS=RUNNING"

            else

              echo "KAFKA_PROCESS_STATUS=FAILED"

              exit 1

            fi


            echo ""

            echo "Checking port 9092..."


            if ss -lnt | grep -q ':9092 '; then

              echo "PORT_9092_STATUS=LISTENING"

            else

              echo "PORT_9092_STATUS=FAILED"

              exit 1

            fi


            echo ""

            echo "Checking port 19092..."


            if ss -lnt | grep -q ':19092 '; then

              echo "PORT_19092_STATUS=LISTENING"

            else

              echo "PORT_19092_STATUS=FAILED"

              exit 1

            fi


            echo ""

            echo "Testing Kafka connectivity..."


            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --list \
              >/tmp/kafka-health-topics.txt


            echo "KAFKA_CONNECTIVITY_STATUS=SUCCESS"


            echo ""

            echo "Kafka Topics:"

            cat /tmp/kafka-health-topics.txt


            echo ""

            echo "=================================================="

            echo "KAFKA_HEALTH_STATUS=PASS"

            echo "=================================================="


  # ================================================================
  # 03 - CREATE TOPIC
  # ================================================================

  create-topic:

    name: "03 - Create Topic"

    needs: kafka-health

    runs-on: ubuntu-latest

    steps:

      - name: Create Kafka Topic

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            PARTITIONS="${{ inputs.partitions }}"

            REPLICATION_FACTOR="${{ inputs.replication_factor }}"

            ENVIRONMENT="${{ inputs.environment }}"


            echo "=================================================="

            echo "03 - CREATE KAFKA TOPIC"

            echo "=================================================="


            echo ""

            echo "Environment        : $ENVIRONMENT"

            echo "Topic              : $TOPIC_NAME"

            echo "Partitions         : $PARTITIONS"

            echo "Replication Factor : $REPLICATION_FACTOR"


            echo ""


            EXISTING_TOPICS=$(
              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --list
            )


            if echo "$EXISTING_TOPICS" | grep -Fxq "$TOPIC_NAME"; then

              echo "Topic already exists."

              echo "TOPIC_STATUS=ALREADY_EXISTS"

            else

              echo "Creating topic..."


              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --create \
                --topic "$TOPIC_NAME" \
                --partitions "$PARTITIONS" \
                --replication-factor "$REPLICATION_FACTOR"


              echo "TOPIC_STATUS=CREATED"

            fi


  # ================================================================
  # 04 - VERIFY TOPIC
  # ================================================================

  verify-topic:

    name: "04 - Verify Topic"

    needs: create-topic

    runs-on: ubuntu-latest

    steps:

      - name: Verify Kafka Topic

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"


            echo "=================================================="

            echo "04 - VERIFY KAFKA TOPIC"

            echo "=================================================="


            echo ""

            echo "Topic:"

            echo "$TOPIC_NAME"


            echo ""


            if "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --list | grep -Fxq "$TOPIC_NAME"; then

              echo "TOPIC_VERIFY_STATUS=SUCCESS"

            else

              echo "TOPIC_VERIFY_STATUS=FAILED"

              exit 1

            fi


            echo ""

            echo "Topic Details"

            echo "--------------------------------------------------"


            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --describe \
              --topic "$TOPIC_NAME"


  # ================================================================
  # 05 - START CONSUMER
  # ================================================================

  consumer:

    name: "05 - Start Consumer"

    needs: verify-topic

    runs-on: ubuntu-latest

    steps:

      - name: Start Kafka Consumer

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            CONSUMER_TIMEOUT="${{ inputs.consumer_timeout }}"

            RUN_ID="${{ github.run_id }}"

            CONSUMER_GROUP="github-actions-$RUN_ID"

            TEST_FILE="/tmp/kafka-consumer-$RUN_ID.txt"

            PID_FILE="/tmp/kafka-consumer-$RUN_ID.pid"


            rm -f "$TEST_FILE"

            rm -f "$PID_FILE"


            echo "=================================================="

            echo "05 - START KAFKA CONSUMER"

            echo "=================================================="


            echo ""

            echo "Topic:"

            echo "$TOPIC_NAME"


            echo ""

            echo "Consumer Group:"

            echo "$CONSUMER_GROUP"


            echo ""

            echo "Consumer Timeout:"

            echo "$CONSUMER_TIMEOUT seconds"


            echo ""

            echo "Consumer Output File:"

            echo "$TEST_FILE"


            echo ""

            echo "Starting consumer..."


            nohup timeout "${CONSUMER_TIMEOUT}s" \
              "$KAFKA_BIN/kafka-console-consumer.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --topic "$TOPIC_NAME" \
              --group "$CONSUMER_GROUP" \
              --from-beginning \
              --property print.key=true \
              --property key.separator=" : " \
              >"$TEST_FILE" 2>&1 < /dev/null &


            CONSUMER_PID=$!


            echo "$CONSUMER_PID" > "$PID_FILE"


            echo ""

            echo "Consumer PID:"

            echo "$CONSUMER_PID"


            echo ""

            echo "Waiting for consumer startup..."


            sleep 5


            if kill -0 "$CONSUMER_PID" 2>/dev/null; then

              echo "CONSUMER_PROCESS_STATUS=RUNNING"

              echo "CONSUMER_STATUS=STARTED"

            else

              echo "CONSUMER_PROCESS_STATUS=FAILED"

              echo "CONSUMER_STATUS=FAILED"


              echo ""

              echo "Consumer Output:"

              cat "$TEST_FILE" 2>/dev/null || true


              exit 1

            fi


  # ================================================================
  # 06 - PRODUCE MESSAGE
  # ================================================================

  producer:

    name: "06 - Produce Message"

    needs: verify-topic

    runs-on: ubuntu-latest

    steps:

      - name: Produce Kafka Message

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            MESSAGE_KEY="${{ inputs.message_key }}"

            PRODUCER_MESSAGE="${{ inputs.producer_message }}"


            echo "=================================================="

            echo "06 - KAFKA PRODUCER"

            echo "=================================================="


            echo ""

            echo "Topic:"

            echo "$TOPIC_NAME"


            echo ""

            echo "Message Key:"

            echo "$MESSAGE_KEY"


            echo ""

            echo "Producer Message:"

            echo "$PRODUCER_MESSAGE"


            # --------------------------------------------------------
            # IMPORTANT
            #
            # parse.key=true
            # key.separator=:
            #
            # therefore Kafka expects:
            #
            # key:value
            # --------------------------------------------------------


            PRODUCER_LINE="$MESSAGE_KEY:$PRODUCER_MESSAGE"


            echo ""

            echo "Producer Input:"

            echo "$PRODUCER_LINE"


            echo ""

            echo "Sending message..."


            printf '%s\n' "$PRODUCER_LINE" | \
              "$KAFKA_BIN/kafka-console-producer.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --topic "$TOPIC_NAME" \
                --property "parse.key=true" \
                --property "key.separator=:"


            echo ""

            echo "PRODUCER_STATUS=SUCCESS"


  # ================================================================
  # 07 - VERIFY CONSUMER MESSAGE
  # ================================================================

  verify-message:

    name: "07 - Verify Consumer Message"

    needs:

      - consumer
      - producer

    runs-on: ubuntu-latest

    steps:

      - name: Verify Kafka Consumer Message

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            set +e

            RUN_ID="${{ github.run_id }}"

            TEST_FILE="/tmp/kafka-consumer-$RUN_ID.txt"

            PID_FILE="/tmp/kafka-consumer-$RUN_ID.pid"

            PRODUCER_MESSAGE="${{ inputs.producer_message }}"

            MESSAGE_KEY="${{ inputs.message_key }}"

            CONSUMER_TIMEOUT="${{ inputs.consumer_timeout }}"


            echo "=================================================="

            echo "07 - VERIFY CONSUMER MESSAGE"

            echo "=================================================="


            echo ""

            echo "Expected Key:"

            echo "$MESSAGE_KEY"


            echo ""

            echo "Expected Message:"

            echo "$PRODUCER_MESSAGE"


            echo ""

            echo "Consumer File:"

            echo "$TEST_FILE"


            FOUND=0


            DEADLINE=$((SECONDS + CONSUMER_TIMEOUT))


            echo ""

            echo "Waiting for message..."


            while [ "$SECONDS" -lt "$DEADLINE" ]; do


              if [ -f "$TEST_FILE" ]; then


                if grep -Fq -- "$PRODUCER_MESSAGE" "$TEST_FILE"; then

                  FOUND=1

                  break

                fi


              fi


              sleep 2


            done


            echo ""

            echo "Consumer Output"

            echo "=================================================="


            if [ -f "$TEST_FILE" ]; then

              cat "$TEST_FILE"

            else

              echo "Consumer output file does not exist."

            fi


            echo "=================================================="


            echo ""


            if [ "$FOUND" -eq 1 ]; then

              echo "CONSUMER_STATUS=SUCCESS"

              echo "MESSAGE_VERIFICATION=SUCCESS"


              if [ -f "$PID_FILE" ]; then

                kill "$(cat "$PID_FILE")" 2>/dev/null || true

              fi


              exit 0


            else

              echo "CONSUMER_STATUS=FAILED"

              echo "MESSAGE_VERIFICATION=FAILED"


              if [ -f "$PID_FILE" ]; then

                kill "$(cat "$PID_FILE")" 2>/dev/null || true

              fi


              exit 1

            fi


  # ================================================================
  # 08 - LIST TOPICS
  # ================================================================

  list-topics:

    name: "08 - List Topics"

    needs: verify-message

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: List Kafka Topics

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"


            echo "=================================================="

            echo "08 - ALL KAFKA TOPICS"

            echo "=================================================="


            ALL_TOPICS=$(
              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --list
            )


            echo ""

            echo "$ALL_TOPICS"


            TOPIC_COUNT=$(
              echo "$ALL_TOPICS" |
              sed '/^[[:space:]]*$/d' |
              wc -l |
              tr -d ' '
            )


            echo ""

            echo "TOTAL_TOPIC_COUNT=$TOPIC_COUNT"


  # ================================================================
  # 09 - TOPIC DETAILS
  # ================================================================

  topic-details:

    name: "09 - Topic Details"

    needs: verify-message

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Get Kafka Topic Details

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"


            echo "=================================================="

            echo "09 - TOPIC DETAILS"

            echo "=================================================="


            echo ""

            echo "Topic:"

            echo "$TOPIC_NAME"


            echo ""

            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --describe \
              --topic "$TOPIC_NAME"


  # ================================================================
  # 10 - GITHUB DASHBOARD
  # ================================================================

  dashboard:

    name: "10 - GitHub Dashboard"

    needs:

      - validate
      - kafka-health
      - create-topic
      - verify-topic
      - consumer
      - producer
      - verify-message
      - list-topics
      - topic-details

    if: always()

    runs-on: ubuntu-latest

    steps:


      - name: Collect Kafka Dashboard Data

        id: collect

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            set +e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            RUN_ID="${{ github.run_id }}"

            CONSUMER_FILE="/tmp/kafka-consumer-$RUN_ID.txt"


            echo "KAFKA_DASHBOARD_COLLECTION"

            echo ""

            echo "TOPICS"

            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --list


            echo ""

            echo "TOPIC_DETAILS"

            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --describe \
              --topic "$TOPIC_NAME"


            echo ""

            echo "CONSUMER_OUTPUT"

            if [ -f "$CONSUMER_FILE" ]; then

              cat "$CONSUMER_FILE"

            else

              echo "Consumer output file unavailable."

            fi


      - name: Generate Enterprise GitHub Dashboard

        env:

          ENVIRONMENT: ${{ inputs.environment }}

          TOPIC_NAME: ${{ inputs.topic_name }}

          PARTITIONS: ${{ inputs.partitions }}

          REPLICATION_FACTOR: ${{ inputs.replication_factor }}

          MESSAGE_KEY: ${{ inputs.message_key }}

          PRODUCER_MESSAGE: ${{ inputs.producer_message }}

          CONSUMER_TIMEOUT: ${{ inputs.consumer_timeout }}

          VALIDATE_RESULT: ${{ needs.validate.result }}

          HEALTH_RESULT: ${{ needs.kafka-health.result }}

          CREATE_RESULT: ${{ needs.create-topic.result }}

          VERIFY_TOPIC_RESULT: ${{ needs.verify-topic.result }}

          CONSUMER_RESULT: ${{ needs.consumer.result }}

          PRODUCER_RESULT: ${{ needs.producer.result }}

          VERIFY_MESSAGE_RESULT: ${{ needs.verify-message.result }}

          LIST_RESULT: ${{ needs.list-topics.result }}

          DETAILS_RESULT: ${{ needs.topic-details.result }}

          JOB_STATUS: ${{ job.status }}


        run: |

          set +e


          icon() {

            case "$1" in

              success)

                echo "🟢 PASSED"

                ;;


              failure)

                echo "🔴 FAILED"

                ;;


              skipped)

                echo "⚪ SKIPPED"

                ;;


              cancelled)

                echo "🟡 CANCELLED"

                ;;


              *)

                echo "⚪ UNKNOWN"

                ;;

            esac

          }


          REPORT="kafka-end-to-end-report.txt"


          # ========================================================
          # GITHUB SUMMARY
          # ========================================================


          {

            echo "# 🚀 Kafka End-to-End CI/CD"

            echo ""

            echo "**Enterprise Kafka Platform CI/CD Pipeline**"

            echo ""

            echo "---"

            echo ""


            # ------------------------------------------------------
            # PIPELINE VISUALIZATION
            # ------------------------------------------------------


            echo "## 🧭 Kafka CI/CD Pipeline"

            echo ""

            echo '```text'

            echo '                         DEVELOPER'

            echo '                             |'

            echo '                             v'

            echo '                    GITHUB REPOSITORY'

            echo '                             |'

            echo '                             v'

            echo '                    GITHUB ACTIONS'

            echo '                             |'

            echo '                             v'

            echo '                  01 Validate Inputs'

            echo '                             |'

            echo '                             v'

            echo '                 02 Kafka Health Check'

            echo '                             |'

            echo '                             v'

            echo '                    03 Create Topic'

            echo '                             |'

            echo '                             v'

            echo '                    04 Verify Topic'

            echo '                             |'

            echo '                    +--------+--------+'

            echo '                    |                 |'

            echo '                    v                 v'

            echo '              05 Consumer        06 Producer'

            echo '                    |                 |'

            echo '                    +--------+--------+'

            echo '                             |'

            echo '                             v'

            echo '                   07 Verify Message'

            echo '                             |'

            echo '                    +--------+--------+'

            echo '                    |                 |'

            echo '                    v                 v'

            echo '              08 List Topics     09 Details'

            echo '                    |                 |'

            echo '                    +--------+--------+'

            echo '                             |'

            echo '                             v'

            echo '                    10 Dashboard'

            echo '                             |'

            echo '                             v'

            echo '                     11 Report'

            echo ''

            echo '                             |'

            echo '                             v'

            echo ''

            echo '                       AWS EC2'

            echo ''

            echo '                  +------------------+'

            echo '                  |     BROKER 1      |'

            echo '                  |   172.31.36.36    |'

            echo '                  |      :9092        |'

            echo '                  +---------+---------+'

            echo '                            |'

            echo '                +-----------+-----------+'

            echo '                |                       |'

            echo '                v                       v'

            echo '          +-----------+           +-----------+'

            echo '          |  BROKER 2 |           | CONTROLLERS|'

            echo '          +-----------+           +-----------+'

            echo '                \\                       /'

            echo '                 \\                     /'

            echo '                  +-------------------+'

            echo '                            |'

            echo '                            v'

            echo '                       KAFKA TOPIC'

            echo '                            |'

            echo '                     +------+------+'

            echo '                     |             |'

            echo '                     v             v'

            echo '                  PRODUCER      CONSUMER'

            echo '                     |             |'

            echo '                     +------v------+'

            echo '                            |'

            echo '                     MESSAGE VERIFY'

            echo '```'

            echo ""


            # ------------------------------------------------------
            # RUNTIME PARAMETERS
