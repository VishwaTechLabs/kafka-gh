name: Kafka End-to-End CI/CD

on:
  workflow_dispatch:
    inputs:

      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - production

      topic_name:
        description: "Kafka topic name"
        required: true
        type: string

      partitions:
        description: "Number of partitions"
        required: true
        type: string
        default: "3"

      replication_factor:
        description: "Replication factor"
        required: true
        type: string
        default: "2"

      message_key:
        description: "Producer message key"
        required: true
        type: string
        default: "github-actions"

      producer_message:
        description: "Message to produce"
        required: true
        type: string
        default: "Hello from GitHub Actions Kafka CI/CD"

      consumer_timeout:
        description: "Consumer timeout in seconds"
        required: true
        type: string
        default: "30"


permissions:
  contents: read


jobs:

  kafka-cicd:

    name: Kafka End-to-End CI/CD

    runs-on: ubuntu-latest


    steps:

      # ============================================================
      # 01 - VALIDATE INPUTS
      # ============================================================

      - name: "01 - Validate Inputs"
        id: validate

        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TOPIC_NAME: ${{ inputs.topic_name }}
          PARTITIONS: ${{ inputs.partitions }}
          REPLICATION_FACTOR: ${{ inputs.replication_factor }}
          MESSAGE_KEY: ${{ inputs.message_key }}
          PRODUCER_MESSAGE: ${{ inputs.producer_message }}
          CONSUMER_TIMEOUT: ${{ inputs.consumer_timeout }}

        run: |

          set -e

          echo "=================================================="
          echo "01 - KAFKA CI/CD INPUT VALIDATION"
          echo "=================================================="

          echo "Environment        : $ENVIRONMENT"
          echo "Topic Name         : $TOPIC_NAME"
          echo "Partitions         : $PARTITIONS"
          echo "Replication Factor : $REPLICATION_FACTOR"
          echo "Message Key        : $MESSAGE_KEY"
          echo "Producer Message   : $PRODUCER_MESSAGE"
          echo "Consumer Timeout   : $CONSUMER_TIMEOUT seconds"

          echo ""
          echo "Validating inputs..."

          # Topic validation
          if [ -z "$TOPIC_NAME" ]; then
            echo "ERROR: Topic name cannot be empty."
            exit 1
          fi

          if [ "${#TOPIC_NAME}" -gt 249 ]; then
            echo "ERROR: Topic name is too long."
            exit 1
          fi

          if ! echo "$TOPIC_NAME" | grep -Eq '^[a-zA-Z0-9._-]+$'; then
            echo "ERROR: Invalid Kafka topic name."
            echo "Allowed characters: a-z A-Z 0-9 . _ -"
            exit 1
          fi

          # Partition validation
          if ! [[ "$PARTITIONS" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Partitions must be numeric."
            exit 1
          fi

          if [ "$PARTITIONS" -lt 1 ]; then
            echo "ERROR: Partitions must be greater than 0."
            exit 1
          fi

          # Replication validation
          if ! [[ "$REPLICATION_FACTOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Replication factor must be numeric."
            exit 1
          fi

          if [ "$REPLICATION_FACTOR" -lt 1 ]; then
            echo "ERROR: Replication factor must be greater than 0."
            exit 1
          fi

          # Your current lab has 2 brokers
          if [ "$REPLICATION_FACTOR" -gt 2 ]; then
            echo "ERROR: Current lab has 2 brokers."
            echo "Maximum replication factor is 2."
            exit 1
          fi

          # Consumer timeout validation
          if ! [[ "$CONSUMER_TIMEOUT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Consumer timeout must be numeric."
            exit 1
          fi

          if [ "$CONSUMER_TIMEOUT" -lt 5 ]; then
            echo "ERROR: Consumer timeout must be at least 5 seconds."
            exit 1
          fi

          # Message validation
          if [ -z "$MESSAGE_KEY" ]; then
            echo "ERROR: Message key cannot be empty."
            exit 1
          fi

          if [ -z "$PRODUCER_MESSAGE" ]; then
            echo "ERROR: Producer message cannot be empty."
            exit 1
          fi

          echo ""
          echo "INPUT_VALIDATION_STATUS=PASS"
          echo "All inputs are valid."


      # ============================================================
      # 02 - KAFKA HEALTH CHECK
      # ============================================================

      - name: "02 - Kafka Health Check"
        id: kafka_health

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s
          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_HOME="/home/ec2-user/kafka"
            KAFKA_BIN="$KAFKA_HOME/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            echo "=================================================="
            echo "02 - KAFKA HEALTH CHECK"
            echo "=================================================="

            echo "Hostname:"
            hostname

            echo ""
            echo "User:"
            whoami

            echo ""
            echo "Private IP:"
            hostname -i

            echo ""
            echo "Kafka Home:"
            echo "$KAFKA_HOME"

            echo ""
            echo "Checking Kafka CLI..."

            if [ ! -f "$KAFKA_BIN/kafka-topics.sh" ]; then
              echo "KAFKA_CLI_STATUS=FAILED"
              exit 1
            fi

            echo "KAFKA_CLI_STATUS=PASS"

            echo ""
            echo "Checking Kafka process..."

            if pgrep -af "kafka.Kafka" | grep -v pgrep >/dev/null; then
              echo "KAFKA_PROCESS_STATUS=RUNNING"
            else
              echo "KAFKA_PROCESS_STATUS=FAILED"
              exit 1
            fi

            echo ""
            echo "Checking port 9092..."

            if ss -lnt | grep -q ':9092 '; then
              echo "PORT_9092_STATUS=LISTENING"
            else
              echo "PORT_9092_STATUS=FAILED"
              exit 1
            fi

            echo ""
            echo "Checking port 19092..."

            if ss -lnt | grep -q ':19092 '; then
              echo "PORT_19092_STATUS=LISTENING"
            else
              echo "PORT_19092_STATUS=FAILED"
              exit 1
            fi

            echo ""
            echo "Testing Kafka connectivity..."

            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --list \
              >/tmp/kafka-health-topics.txt

            echo "KAFKA_CONNECTIVITY_STATUS=SUCCESS"

            echo ""
            echo "Kafka topics currently available:"
            cat /tmp/kafka-health-topics.txt

            echo ""
            echo "KAFKA_HEALTH_STATUS=PASS"


      # ============================================================
      # 03 - CREATE TOPIC
      # ============================================================

      - name: "03 - Create Topic"
        id: create_topic

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s
          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"
            PARTITIONS="${{ inputs.partitions }}"
            REPLICATION_FACTOR="${{ inputs.replication_factor }}"
            ENVIRONMENT="${{ inputs.environment }}"

            echo "=================================================="
            echo "03 - CREATE KAFKA TOPIC"
            echo "=================================================="

            echo "Environment        : $ENVIRONMENT"
            echo "Topic              : $TOPIC_NAME"
            echo "Partitions         : $PARTITIONS"
            echo "Replication Factor : $REPLICATION_FACTOR"

            echo ""

            EXISTING_TOPICS=$(
              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --list
            )

            if echo "$EXISTING_TOPICS" | grep -Fxq "$TOPIC_NAME"; then

              echo "Topic already exists."

              echo "TOPIC_STATUS=ALREADY_EXISTS"

            else

              echo "Creating topic..."

              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --create \
                --topic "$TOPIC_NAME" \
                --partitions "$PARTITIONS" \
                --replication-factor "$REPLICATION_FACTOR"

              echo "TOPIC_STATUS=CREATED"

            fi


      # ============================================================
      # 04 - VERIFY TOPIC
      # ============================================================

      - name: "04 - Verify Topic"
        id: verify_topic

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s
          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            echo "=================================================="
            echo "04 - VERIFY KAFKA TOPIC"
            echo "=================================================="

            echo "Topic:"
            echo "$TOPIC_NAME"

            echo ""

            if "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --list | grep -Fxq "$TOPIC_NAME"; then

              echo "TOPIC_VERIFY_STATUS=SUCCESS"

            else

              echo "TOPIC_VERIFY_STATUS=FAILED"
              exit 1

            fi

            echo ""
            echo "Topic details:"
            echo "--------------------------------------------------"

            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --describe \
              --topic "$TOPIC_NAME"


      # ============================================================
      # 05 - START CONSUMER
      # ============================================================

      - name: "05 - Start Consumer"
        id: consumer

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s
          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            CONSUMER_TIMEOUT="${{ inputs.consumer_timeout }}"

            RUN_ID="${{ github.run_id }}"

            CONSUMER_GROUP="github-actions-$RUN_ID"

            TEST_FILE="/tmp/kafka-consumer-$RUN_ID.txt"

            PID_FILE="/tmp/kafka-consumer-$RUN_ID.pid"

            rm -f "$TEST_FILE"
            rm -f "$PID_FILE"

            echo "=================================================="
            echo "05 - START KAFKA CONSUMER"
            echo "=================================================="

            echo "Topic:"
            echo "$TOPIC_NAME"

            echo ""
            echo "Consumer Group:"
            echo "$CONSUMER_GROUP"

            echo ""
            echo "Timeout:"
            echo "$CONSUMER_TIMEOUT seconds"

            echo ""
            echo "Consumer output file:"
            echo "$TEST_FILE"

            echo ""
            echo "Starting consumer..."

            nohup timeout "${CONSUMER_TIMEOUT}s" \
              "$KAFKA_BIN/kafka-console-consumer.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --topic "$TOPIC_NAME" \
              --group "$CONSUMER_GROUP" \
              --from-beginning \
              --property print.key=true \
              --property key.separator=" : " \
              >"$TEST_FILE" 2>&1 < /dev/null &

            CONSUMER_PID=$!

            echo "$CONSUMER_PID" > "$PID_FILE"

            echo ""
            echo "Consumer PID:"
            echo "$CONSUMER_PID"

            echo ""
            echo "Waiting for consumer startup..."

            sleep 5

            if kill -0 "$CONSUMER_PID" 2>/dev/null; then

              echo "CONSUMER_PROCESS_STATUS=RUNNING"
              echo "CONSUMER_STATUS=STARTED"

            else

              echo "CONSUMER_PROCESS_STATUS=FAILED"
              echo "CONSUMER_STATUS=FAILED"

              echo ""
              echo "Consumer output:"
              cat "$TEST_FILE" 2>/dev/null || true

              exit 1

            fi


      # ============================================================
      # 06 - PRODUCE MESSAGE
      # ============================================================

      - name: "06 - Produce Message"
        id: producer

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s
          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            MESSAGE_KEY="${{ inputs.message_key }}"

            PRODUCER_MESSAGE="${{ inputs.producer_message }}"

            echo "=================================================="
            echo "06 - KAFKA PRODUCER"
            echo "=================================================="

            echo "Topic:"
            echo "$TOPIC_NAME"

            echo ""
            echo "Message Key:"
            echo "$MESSAGE_KEY"

            echo ""
            echo "Producer Message:"
            echo "$PRODUCER_MESSAGE"

            # IMPORTANT
            #
            # Kafka console producer is configured with:
            #
            # parse.key=true
            # key.separator=:
            #
            # Therefore the input MUST be:
            #
            # key:value

            PRODUCER_LINE="$MESSAGE_KEY:$PRODUCER_MESSAGE"

            echo ""
            echo "Producer Input:"
            echo "$PRODUCER_LINE"

            echo ""
            echo "Sending message to Kafka..."

            printf '%s\n' "$PRODUCER_LINE" | \
              "$KAFKA_BIN/kafka-console-producer.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --topic "$TOPIC_NAME" \
                --property "parse.key=true" \
                --property "key.separator=:"

            echo ""
            echo "PRODUCER_STATUS=SUCCESS"


      # ============================================================
      # 07 - VERIFY CONSUMER MESSAGE
      # ============================================================

      - name: "07 - Verify Consumer Message"
        id: verify_consumer

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s
          command_timeout: 5m

          capture_stdout: true

          script: |

            set +e

            RUN_ID="${{ github.run_id }}"

            TEST_FILE="/tmp/kafka-consumer-$RUN_ID.txt"

            PID_FILE="/tmp/kafka-consumer-$RUN_ID.pid"

            PRODUCER_MESSAGE="${{ inputs.producer_message }}"

            MESSAGE_KEY="${{ inputs.message_key }}"

            CONSUMER_TIMEOUT="${{ inputs.consumer_timeout }}"

            echo "=================================================="
            echo "07 - VERIFY CONSUMER MESSAGE"
            echo "=================================================="

            echo "Expected Key:"
            echo "$MESSAGE_KEY"

            echo ""
            echo "Expected Message:"
            echo "$PRODUCER_MESSAGE"

            echo ""
            echo "Consumer File:"
            echo "$TEST_FILE"

            FOUND=0

            DEADLINE=$((SECONDS + CONSUMER_TIMEOUT))

            echo ""
            echo "Waiting for consumer message..."

            while [ "$SECONDS" -lt "$DEADLINE" ]; do

              if [ -f "$TEST_FILE" ]; then

                if grep -Fq -- "$PRODUCER_MESSAGE" "$TEST_FILE"; then

                  FOUND=1
                  break

                fi

              fi

              sleep 2

            done

            echo ""
            echo "Consumer Output"
            echo "=================================================="

            if [ -f "$TEST_FILE" ]; then

              cat "$TEST_FILE"

            else

              echo "Consumer output file does not exist."

            fi

            echo "=================================================="

            echo ""

            if [ "$FOUND" -eq 1 ]; then

              echo "CONSUMER_STATUS=SUCCESS"
              echo "MESSAGE_VERIFICATION=SUCCESS"

              if [ -f "$PID_FILE" ]; then
                kill "$(cat "$PID_FILE")" 2>/dev/null || true
              fi

              exit 0

            else

              echo "CONSUMER_STATUS=FAILED"
              echo "MESSAGE_VERIFICATION=FAILED"

              if [ -f "$PID_FILE" ]; then
                kill "$(cat "$PID_FILE")" 2>/dev/null || true
              fi

              exit 1

            fi


      # ============================================================
      # 08 - LIST TOPICS
      # ============================================================

      - name: "08 - List Topics"
        id: list_topics

        if: always()

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s
          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            echo "=================================================="
            echo "08 - ALL KAFKA TOPICS"
            echo "=================================================="

            ALL_TOPICS=$(
              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --list
            )

            echo "$ALL_TOPICS"

            TOPIC_COUNT=$(
              echo "$ALL_TOPICS" |
              sed '/^[[:space:]]*$/d' |
              wc -l |
              tr -d ' '
            )

            echo ""
            echo "TOTAL_TOPIC_COUNT=$TOPIC_COUNT"


      # ============================================================
      # 09 - TOPIC DETAILS
      # ============================================================

      - name: "09 - Topic Details"
        id: topic_details

        if: always()

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s
          command_timeout: 5m

          capture_stdout: true

          script: |

            set -e

            KAFKA_BIN="/home/ec2-user/kafka/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            TOPIC_NAME="${{ inputs.topic_name }}"

            echo "=================================================="
            echo "09 - TOPIC DETAILS"
            echo "=================================================="

            echo "Topic:"
            echo "$TOPIC_NAME"

            echo ""

            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --describe \
              --topic "$TOPIC_NAME"


      # ============================================================
      # 10 - GITHUB DASHBOARD
      # ============================================================

      - name: "10 - GitHub Dashboard"
        id: dashboard

        if: always()

        env:

          ENVIRONMENT: ${{ inputs.environment }}

          TOPIC_NAME: ${{ inputs.topic_name }}

          PARTITIONS: ${{ inputs.partitions }}

          REPLICATION_FACTOR: ${{ inputs.replication_factor }}

          MESSAGE_KEY: ${{ inputs.message_key }}

          PRODUCER_MESSAGE: ${{ inputs.producer_message }}

          CONSUMER_TIMEOUT: ${{ inputs.consumer_timeout }}

          VALIDATION_STATUS: ${{ steps.validate.outcome }}

          HEALTH_STATUS: ${{ steps.kafka_health.outcome }}

          CREATE_STATUS: ${{ steps.create_topic.outcome }}

          VERIFY_TOPIC_STATUS: ${{ steps.verify_topic.outcome }}

          CONSUMER_STATUS: ${{ steps.consumer.outcome }}

          PRODUCER_STATUS: ${{ steps.producer.outcome }}

          VERIFY_CONSUMER_STATUS: ${{ steps.verify_consumer.outcome }}

          LIST_TOPICS_STATUS: ${{ steps.list_topics.outcome }}

          TOPIC_DETAILS_STATUS: ${{ steps.topic_details.outcome }}

          TOPICS_OUTPUT: ${{ steps.list_topics.outputs.stdout }}

          DETAILS_OUTPUT: ${{ steps.topic_details.outputs.stdout }}

          VERIFY_OUTPUT: ${{ steps.verify_consumer.outputs.stdout }}

          JOB_STATUS: ${{ job.status }}


        run: |

          set +e


          status_icon() {

            case "$1" in

              success)
                echo "🟢 PASSED"
                ;;

              failure)
                echo "🔴 FAILED"
                ;;

              skipped)
                echo "⚪ SKIPPED"
                ;;

              cancelled)
                echo "🟡 CANCELLED"
                ;;

              *)
                echo "⚪ UNKNOWN"
                ;;

            esac

          }


          echo "Generating GitHub Actions Dashboard..."


          # ========================================================
          # GITHUB ACTIONS SUMMARY
          # ========================================================

          {

            echo "# 🚀 Kafka End-to-End CI/CD"

            echo ""

            echo "---"

            echo ""

            echo "## 🧭 Kafka CI/CD Pipeline"

            echo ""

            echo '```text'

            echo '                         DEVELOPER'

            echo '                             |'

            echo '                             v'

            echo '                    GITHUB REPOSITORY'

            echo '                             |'

            echo '                             v'

            echo '                    GITHUB ACTIONS'

            echo '                             |'

            echo '                             v'

            echo '                  01 Validate Inputs'

            echo '                             |'

            echo '                             v'

            echo '                 02 Kafka Health Check'

            echo '                             |'

            echo '                             v'

            echo '                    03 Create Topic'

            echo '                             |'

            echo '                             v'

            echo '                    04 Verify Topic'

            echo '                             |'

            echo '                             v'

            echo '                    05 Start Consumer'

            echo '                             |'

            echo '                             v'

            echo '                    06 Produce Message'

            echo '                             |'

            echo '                             v'

            echo '                07 Verify Consumer Message'

            echo '                             |'

            echo '                             v'

            echo '                    08 List Topics'

            echo '                             |'

            echo '                             v'

            echo '                    09 Topic Details'

            echo '                             |'

            echo '                             v'

            echo '                  10 GitHub Dashboard'

            echo '                             |'

            echo '                             v'

            echo '                    11 Upload Report'

            echo ''

            echo '                             |'

            echo '                             v'

            echo '                    AWS EC2 / KAFKA'

            echo ''

            echo '                    +----------------+'

            echo '                    |    BROKER 1     |'

            echo '                    | 172.31.36.36    |'

            echo '                    |     :9092       |'

            echo '                    +----------------+'

            echo '                            |'

            echo '                            |'

            echo '              +-------------+-------------+'

            echo '              |                           |'

            echo '              v                           v'

            echo '       +--------------+            +--------------+'

            echo '       |   BROKER 2   |            | CONTROLLERS  |'

            echo '       +--------------+            +--------------+'

            echo '              \\                           /'

            echo '               \\                         /'

            echo '                +-----------------------+'

            echo '                            |'

            echo '                            v'

            echo '                         KAFKA TOPIC'

            echo '                            |'

            echo '               +------------+------------+'

            echo '               |                         |'

            echo '               v                         v'

            echo '          PRODUCER                  CONSUMER'

            echo '               |                         |'

            echo '               +------ MESSAGE ---------+'

            echo '                            |'

            echo '                            v'

            echo '                  MESSAGE VERIFICATION'

            echo '```'

            echo ""


            # ========================================================
            # RUNTIME PARAMETERS
            # ========================================================

            echo "## 🎯 Runtime Parameters"

            echo ""

            echo "| Parameter | Value |"

            echo "|---|---|"

            echo "| Environment | **$ENVIRONMENT** |"

            echo "| Topic | **\`$TOPIC_NAME\`** |"

            echo "| Partitions | **$PARTITIONS** |"

            echo "| Replication Factor | **$REPLICATION_FACTOR** |"

            echo "| Message Key | **\`$MESSAGE_KEY\`** |"

            echo "| Producer Message | **\`$PRODUCER_MESSAGE\`** |"

            echo "| Consumer Timeout | **$CONSUMER_TIMEOUT seconds** |"

            echo ""


            # ========================================================
            # PIPELINE STATUS
            # ========================================================

            echo "## 🏃 Pipeline Execution Status"

            echo ""

            echo "| # | Stage | Status |"

            echo "|---:|---|---|"

            echo "| 01 | Validate Inputs | $(status_icon "$VALIDATION_STATUS") |"

            echo "| 02 | Kafka Health Check | $(status_icon "$HEALTH_STATUS") |"

            echo "| 03 | Create Topic | $(status_icon "$CREATE_STATUS") |"

            echo "| 04 | Verify Topic | $(status_icon "$VERIFY_TOPIC_STATUS") |"

            echo "| 05 | Start Consumer | $(status_icon "$CONSUMER_STATUS") |"

            echo "| 06 | Produce Message | $(status_icon "$PRODUCER_STATUS") |"

            echo "| 07 | Verify Consumer Message | $(status_icon "$VERIFY_CONSUMER_STATUS") |"

            echo "| 08 | List Topics | $(status_icon "$LIST_TOPICS_STATUS") |"

            echo "| 09 | Topic Details | $(status_icon "$TOPIC_DETAILS_STATUS") |"

            echo "| 10 | GitHub Dashboard | 🟢 GENERATED |"

            echo "| 11 | Upload Report | 🟢 READY |"

            echo ""


            # ========================================================
            # PRODUCER / CONSUMER
            # ========================================================

            echo "## 📨 Producer → Consumer Test"

            echo ""

            echo "| Item | Value |"

            echo "|---|---|"

            echo "| Topic | \`$TOPIC_NAME\` |"

            echo "| Message Key | \`$MESSAGE_KEY\` |"

            echo "| Producer Message | \`$PRODUCER_MESSAGE\` |"

            echo "| Producer | $(status_icon "$PRODUCER_STATUS") |"

            echo "| Consumer | $(status_icon "$CONSUMER_STATUS") |"

            echo "| Message Verification | $(status_icon "$VERIFY_CONSUMER_STATUS") |"

            echo ""


            # ========================================================
            # CONSUMER OUTPUT
            # ========================================================

            echo "## 📥 Consumer Verification Output"

            echo ""

            echo '```text'

            if [ -n "$VERIFY_OUTPUT" ]; then

              printf '%s\n' "$VERIFY_OUTPUT"

            else

              echo "Consumer verification output unavailable."

            fi

            echo '```'

            echo ""


            # ========================================================
            # KAFKA TOPICS
            # ========================================================

            echo "## 📊 Kafka Topics"

            echo ""

            if [ -n "$TOPICS_OUTPUT" ]; then

              echo '```text'

              printf '%s\n' "$TOPICS_OUTPUT"

              echo '```'

            else

              echo "Topic listing unavailable."

            fi

            echo ""


            # ========================================================
            # TOPIC DETAILS
            # ========================================================

            echo "## 🔍 Topic Details"

            echo ""

            if [ -n "$DETAILS_OUTPUT" ]; then

              echo '```text'

              printf '%s\n' "$DETAILS_OUTPUT"

              echo '```'

            else

              echo "Topic details unavailable."

            fi

            echo ""


            # ========================================================
            # CI/CD ROADMAP
            # ========================================================

            echo "## 🚀 Kafka CI/CD Progression"

            echo ""

            echo '```text'

            echo 'Level 1'

            echo 'Health Check'

            echo '     |'

            echo '     v'

            echo 'Topic Management'

            echo '     |'

            echo '     v'

            echo 'Producer / Consumer Testing'

            echo '     |'

            echo '     v'

            echo 'Level 2'

            echo 'Topic-as-Code'

            echo '     |'

            echo '     v'

            echo 'ACL-as-Code'

            echo '     |'

            echo '     v'

            echo 'Level 3'

            echo 'Schema Registry CI/CD'

            echo '     |'

            echo '     v'

            echo 'Kafka Connect CI/CD'

            echo '     |'

            echo '     v'

            echo 'Level 4'

            echo 'Terraform + AWS + Kafka'

            echo '     |'

            echo '     v'

            echo 'Enterprise Kafka Platform CI/CD'

            echo '```'

            echo ""


            # ========================================================
            # OVERALL STATUS
            # ========================================================

            echo "## 📌 Overall Job Status"

            echo ""

            echo "**$JOB_STATUS**"

            echo ""

            echo "---"

            echo ""

            echo "Generated by VishwaTechLabs Kafka CI/CD Pipeline."

          } >> "$GITHUB_STEP_SUMMARY"


          # ========================================================
          # CREATE REPORT FOR STAGE 11
          # ========================================================

          REPORT="kafka-end-to-end-report.txt"

          rm -f "$REPORT"


          printf '%s\n' \
            "Kafka End-to-End CI/CD Report" \
            "========================================" \
            "" \
            "Run ID: ${{ github.run_id }}" \
            "Environment: $ENVIRONMENT" \
            "Topic: $TOPIC_NAME" \
            "Partitions: $PARTITIONS" \
            "Replication Factor: $REPLICATION_FACTOR" \
            "Message Key: $MESSAGE_KEY" \
            "Producer Message: $PRODUCER_MESSAGE" \
            "Consumer Timeout: $CONSUMER_TIMEOUT" \
            "" \
            "PIPELINE" \
            "01 Validate Inputs" \
            "02 Kafka Health Check" \
            "03 Create Topic" \
            "04 Verify Topic" \
            "05 Start Consumer" \
            "06 Produce Message" \
            "07 Verify Consumer Message" \
            "08 List Topics" \
            "09 Topic Details" \
            "10 GitHub Dashboard" \
            "11 Upload Report" \
            "" \
            "STATUS" \
            "Validate: $VALIDATION_STATUS" \
            "Health: $HEALTH_STATUS" \
            "Create Topic: $CREATE_STATUS" \
            "Verify Topic: $VERIFY_TOPIC_STATUS" \
            "Consumer: $CONSUMER_STATUS" \
