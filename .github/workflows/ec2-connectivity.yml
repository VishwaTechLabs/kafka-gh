name: Kafka Broker 1 Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  kafka-health-check:

    name: Kafka Broker 1 - Health & Topics

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CONNECT TO EC2 AND CHECK KAFKA
      # ==========================================================

      - name: Connect to Kafka Broker 1
        id: kafka
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s
          command_timeout: 5m

          capture_stdout: true

          script: |

            echo "=================================================="
            echo "        KAFKA BROKER 1 HEALTH CHECK"
            echo "=================================================="

            KAFKA_HOME="/home/ec2-user/kafka"
            KAFKA_BIN="$KAFKA_HOME/bin"
            BOOTSTRAP_SERVER="172.31.36.36:9092"

            echo ""
            echo "SERVER INFORMATION"
            echo "--------------------------------------------------"

            echo "Hostname:"
            hostname

            echo ""

            echo "User:"
            whoami

            echo ""

            echo "Private IP:"
            hostname -i

            echo ""

            echo "Uptime:"
            uptime


            # ==================================================
            # KAFKA CLI
            # ==================================================

            echo ""
            echo "KAFKA CLI"
            echo "--------------------------------------------------"

            if [ -f "$KAFKA_BIN/kafka-topics.sh" ]; then

              echo "KAFKA_CLI_STATUS=PASS"

            else

              echo "KAFKA_CLI_STATUS=FAIL"
              exit 1

            fi


            # ==================================================
            # KAFKA PROCESS
            # ==================================================

            echo ""
            echo "KAFKA PROCESS"
            echo "--------------------------------------------------"

            KAFKA_PROCESS=$(pgrep -af "kafka.Kafka" | head -1 || true)

            if [ -n "$KAFKA_PROCESS" ]; then

              echo "KAFKA_PROCESS_STATUS=RUNNING"

              echo ""
              echo "Process:"
              echo "$KAFKA_PROCESS"

            else

              echo "KAFKA_PROCESS_STATUS=NOT_RUNNING"
              exit 1

            fi


            # ==================================================
            # PORT 9092
            # ==================================================

            echo ""
            echo "PORT 9092"
            echo "--------------------------------------------------"

            if ss -lnt | grep -q ':9092 '; then

              echo "PORT_9092_STATUS=LISTENING"

            else

              echo "PORT_9092_STATUS=NOT_LISTENING"
              exit 1

            fi


            # ==================================================
            # PORT 19092
            # ==================================================

            echo ""
            echo "PORT 19092"
            echo "--------------------------------------------------"

            if ss -lnt | grep -q ':19092 '; then

              echo "PORT_19092_STATUS=LISTENING"

            else

              echo "PORT_19092_STATUS=NOT_LISTENING"
              exit 1

            fi


            # ==================================================
            # KAFKA CONNECTIVITY
            # ==================================================

            echo ""
            echo "KAFKA CONNECTIVITY"
            echo "--------------------------------------------------"

            echo "Bootstrap Server:"
            echo "$BOOTSTRAP_SERVER"

            echo ""

            TOPICS=$(
              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --list \
                2>&1
            )

            KAFKA_EXIT=$?

            if [ "$KAFKA_EXIT" -eq 0 ]; then

              echo "KAFKA_CONNECTIVITY_STATUS=SUCCESS"

            else

              echo "KAFKA_CONNECTIVITY_STATUS=FAILED"

              echo ""
              echo "Kafka error:"
              echo "$TOPICS"

              exit 1

            fi


            # ==================================================
            # TOPICS
            # ==================================================

            echo ""
            echo "KAFKA_TOPICS"
            echo "--------------------------------------------------"

            echo "$TOPICS"


            # ==================================================
            # TOPIC COUNT
            # ==================================================

            TOPIC_COUNT=$(
              echo "$TOPICS" |
              sed '/^[[:space:]]*$/d' |
              wc -l
            )

            echo ""
            echo "TOPIC_COUNT=$TOPIC_COUNT"


            # ==================================================
            # FINAL RESULT
            # ==================================================

            echo ""
            echo "=================================================="
            echo "KAFKA HEALTH CHECK PASSED"
            echo "=================================================="

            echo "EC2_STATUS=PASS"
            echo "KAFKA_CLI=PASS"
            echo "KAFKA_PROCESS=RUNNING"
            echo "PORT_9092=LISTENING"
            echo "PORT_19092=LISTENING"
            echo "KAFKA_CONNECTIVITY=SUCCESS"
            echo "TOPIC_COUNT=$TOPIC_COUNT"

            echo "=================================================="


      # ==========================================================
      # 2. CREATE LOCAL REPORT
      # ==========================================================

      - name: Create Kafka Health Report
        if: always()

        env:
          SSH_OUTPUT: ${{ steps.kafka.outputs.stdout }}

        run: |

          echo "$SSH_OUTPUT" > kafka-broker-1-health-report.txt

          echo ""
          echo "=================================================="
          echo "KAFKA HEALTH REPORT"
          echo "=================================================="

          cat kafka-broker-1-health-report.txt


      # ==========================================================
      # 3. CREATE GITHUB ACTIONS SUMMARY
      # ==========================================================

      - name: Create GitHub Dashboard
        if: always()

        env:
          SSH_OUTPUT: ${{ steps.kafka.outputs.stdout }}

        run: |

          TOPIC_COUNT=$(echo "$SSH_OUTPUT" |
            grep "^TOPIC_COUNT=" |
            cut -d= -f2)

          KAFKA_CLI=$(echo "$SSH_OUTPUT" |
            grep "^KAFKA_CLI_STATUS=" |
            cut -d= -f2)

          KAFKA_PROCESS=$(echo "$SSH_OUTPUT" |
            grep "^KAFKA_PROCESS_STATUS=" |
            cut -d= -f2)

          PORT_9092=$(echo "$SSH_OUTPUT" |
            grep "^PORT_9092_STATUS=" |
            cut -d= -f2)

          PORT_19092=$(echo "$SSH_OUTPUT" |
            grep "^PORT_19092_STATUS=" |
            cut -d= -f2)

          KAFKA_CONNECTIVITY=$(echo "$SSH_OUTPUT" |
            grep "^KAFKA_CONNECTIVITY_STATUS=" |
            cut -d= -f2)


          if [ "$KAFKA_CLI" = "PASS" ]; then
            CLI_ICON="🟢"
          else
            CLI_ICON="🔴"
          fi

          if [ "$KAFKA_PROCESS" = "RUNNING" ]; then
            PROCESS_ICON="🟢"
          else
            PROCESS_ICON="🔴"
          fi

          if [ "$PORT_9092" = "LISTENING" ]; then
            PORT_9092_ICON="🟢"
          else
            PORT_9092_ICON="🔴"
          fi

          if [ "$PORT_19092" = "LISTENING" ]; then
            PORT_19092_ICON="🟢"
          else
            PORT_19092_ICON="🔴"
          fi

          if [ "$KAFKA_CONNECTIVITY" = "SUCCESS" ]; then
            KAFKA_ICON="🟢"
          else
            KAFKA_ICON="🔴"
          fi


          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          # 🚀 Kafka Platform Health Dashboard

          ## 🟢 Broker 1 Health

          | Component | Status |
          |---|---|
          | 🔐 EC2 SSH | 🟢 CONNECTED |
          | 📦 Kafka CLI | $CLI_ICON $KAFKA_CLI |
          | ⚙️ Kafka Process | $PROCESS_ICON $KAFKA_PROCESS |
          | 🔌 Port 9092 | $PORT_9092_ICON $PORT_9092 |
          | 🔌 Port 19092 | $PORT_19092_ICON $PORT_19092 |
          | 🔗 Kafka Connectivity | $KAFKA_ICON $KAFKA_CONNECTIVITY |
          | 📊 Kafka Topics | 🟢 **$TOPIC_COUNT** |

          ---

          ## 🖥️ EC2 / Kafka Information

          | Property | Value |
          |---|---|
          | Broker | \`broker1\` |
          | Private IP | \`172.31.36.36\` |
          | Kafka Home | \`/home/ec2-user/kafka\` |
          | Bootstrap Server | \`172.31.36.36:9092\` |
          | Kafka Mode | \`KRaft\` |

          ---

          ## 🔗 CI Connectivity

          \`\`\`text
          
                         GITHUB
                            |
                            |
                    GitHub Actions
                            |
                            | SSH :22
                            |
                            v
                +-----------------------+
                |       AWS EC2         |
                |       BROKER 1        |
                |     172.31.36.36      |
                +-----------+-----------+
                            |
                            |
                       Kafka Process
                            |
                   +--------+--------+
                   |                 |
                   v                 v
              Port 9092        Port 19092
                   |                 |
                   +--------+--------+
                            |
                            v
                       Apache Kafka
                            |
                            v
                     KRaft Cluster
          \`\`\`

          ---

          ## 🏗️ Kafka KRaft Architecture

          \`\`\`text
                            AWS VPC

              +-------------------------------+
              |                               |
              |        KAFKA CLUSTER          |
              |                               |
              |  +-------------------------+  |
              |  |       BROKER 1          |  |
              |  |     172.31.36.36        |  |
              |  +------------+------------+  |
              |               |               |
              |  +------------+------------+  |
              |  |       BROKER 2          |  |
              |  |     172.31.42.7         |  |
              |  +------------+------------+  |
              |               |               |
              |              KRaft            |
              |               |               |
              |       +-------+-------+       |
              |       |               |       |
              |       v               v       |
              |  +---------+     +---------+ |
              |  | CTRL 1  |     | CTRL 2  | |
              |  |172.31.35.220| |172.31.34.34| |
              |  +---------+     +---------+ |
              |                               |
              +-------------------------------+

          \`\`\`

          ---

          ## 🔄 CI/CD Pipeline

          \`\`\`text

          👨‍💻 Developer
                 |
                 v
          📦 GitHub Repository
                 |
                 v
          ⚙️ GitHub Actions
                 |
                 v
          🔐 SSH Authentication
                 |
                 v
          ☁️ AWS EC2
                 |
                 v
          🖥️ Kafka Broker 1
                 |
          +------+------+
          |             |
          v             v
       Process        Ports
          |             |
          +------+------+
                 |
                 v
          🔗 Kafka Connectivity
                 |
                 v
          📊 Topic Discovery
                 |
                 v
          📈 Topic Count
                 |
                 v
          📋 Health Report
                 |
          +------+------+
          |             |
          v             v
       Job Logs      Summary
                         |
                         v
                      Artifact

          \`\`\`

          ---

          ## 📊 Kafka Topics

          The topic list below is collected directly from Kafka during this
          GitHub Actions execution.

          \`\`\`text
          $(echo "$SSH_OUTPUT" | sed -n '/^KAFKA_TOPICS$/,/^TOPIC_COUNT=/p' | sed '$d')
          \`\`\`

          **Total Topics: $TOPIC_COUNT**

          ---

          ## 🎯 CI/CD Progression

          \`\`\`text
          
          ✅ EC2 CONNECTIVITY
                  |
                  v
          ✅ KAFKA HEALTH CHECK
                  |
                  v
          🎯 CREATE TOPIC
                  |
                  v
          🎯 ALTER TOPIC
                  |
                  v
          🎯 TOPIC-AS-CODE
                  |
                  v
          🎯 ACL-AS-CODE
                  |
                  v
          🎯 SCHEMA CI/CD
                  |
                  v
          🎯 KAFKA CONNECT CI/CD
                  |
                  v
          🚀 ENTERPRISE KAFKA PLATFORM CI/CD

          \`\`\`

          EOF


      # ==========================================================
      # 4. UPLOAD REPORT
      # ==========================================================

      - name: Upload Kafka Health Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: kafka-broker-1-health-report
          path: kafka-broker-1-health-report.txt
          retention-days: 30
