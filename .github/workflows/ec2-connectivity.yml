          # CREATE REPORT
          # ========================================================


          rm -f "$REPORT"


          printf '%s\n' \

            "Kafka End-to-End CI/CD Report" \

            "========================================" \

            "" \

            "Run ID: ${{ github.run_id }}" \

            "Environment: $ENVIRONMENT" \

            "Topic: $TOPIC_NAME" \

            "Partitions: $PARTITIONS" \

            "Replication Factor: $REPLICATION_FACTOR" \

            "Message Key: $MESSAGE_KEY" \

            "Producer Message: $PRODUCER_MESSAGE" \

            "Consumer Timeout: $CONSUMER_TIMEOUT" \

            "" \

            "PIPELINE STATUS" \

            "01 Validate Inputs       : $VALIDATE_RESULT" \

            "02 Kafka Health          : $HEALTH_RESULT" \

            "03 Create Topic          : $CREATE_RESULT" \

            "04 Verify Topic          : $VERIFY_TOPIC_RESULT" \

            "05 Consumer              : $CONSUMER_RESULT" \

