name: Kafka Broker 1 Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  kafka-health-check:

    name: Kafka Broker 1 - Health & Topics

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # STEP 1
      # SSH TO BROKER 1 AND RUN ALL KAFKA HEALTH CHECKS
      # ==========================================================

      - name: 🔐 Connect to Kafka Broker 1
        id: kafka_check
        uses: appleboy/ssh-action@v1
        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 10m

          script: |

            set -uo pipefail

            # ==================================================
            # VARIABLES
            # ==================================================

            KAFKA_HOME="/home/ec2-user/kafka"

            KAFKA_BIN="$KAFKA_HOME/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            echo ""
            echo "============================================================"
            echo "             🚀 KAFKA BROKER 1 HEALTH CHECK"
            echo "============================================================"
            echo ""

            # ==================================================
            # SERVER INFORMATION
            # ==================================================

            echo "============================================================"
            echo "🖥️ SERVER INFORMATION"
            echo "============================================================"

            echo ""

            echo "Hostname:"
            hostname

            echo ""

            echo "User:"
            whoami

            echo ""

            echo "Private IP:"
            hostname -i

            echo ""

            echo "Uptime:"
            uptime

            echo ""

            # ==================================================
            # KAFKA INSTALLATION CHECK
            # ==================================================

            echo "============================================================"
            echo "📦 KAFKA INSTALLATION"
            echo "============================================================"

            echo ""

            echo "Kafka Home:"
            echo "$KAFKA_HOME"

            echo ""

            echo "Kafka CLI:"
            echo "$KAFKA_BIN/kafka-topics.sh"

            echo ""

            if [ -f "$KAFKA_BIN/kafka-topics.sh" ]; then

              echo "🟢 Kafka CLI Status: AVAILABLE"

            else

              echo "🔴 Kafka CLI Status: NOT FOUND"

              exit 1

            fi

            echo ""

            # ==================================================
            # KAFKA PROCESS CHECK
            # ==================================================

            echo "============================================================"
            echo "⚙️ KAFKA PROCESS CHECK"
            echo "============================================================"

            echo ""

            KAFKA_PID=$(pgrep -f 'kafka.Kafka' | head -1 || true)

            if [ -n "$KAFKA_PID" ]; then

              echo "🟢 Kafka Process Status: RUNNING"

              echo ""

              echo "Kafka PID:"
              echo "$KAFKA_PID"

              echo ""

              echo "Kafka Process:"
              ps -fp "$KAFKA_PID" || true

            else

              echo "🔴 Kafka Process Status: NOT RUNNING"

              exit 1

            fi

            echo ""

            # ==================================================
            # PORT 9092
            # ==================================================

            echo "============================================================"
            echo "🔌 KAFKA PORT 9092"
            echo "============================================================"

            echo ""

            if ss -lnt | grep -q ':9092'; then

              echo "🟢 Kafka Port 9092: LISTENING"

            else

              echo "🔴 Kafka Port 9092: NOT LISTENING"

              exit 1

            fi

            echo ""

            # ==================================================
            # PORT 19092
            # ==================================================

            echo "============================================================"
            echo "🔌 KAFKA PORT 19092"
            echo "============================================================"

            echo ""

            if ss -lnt | grep -q ':19092'; then

              echo "🟢 Kafka Port 19092: LISTENING"

            else

              echo "🔴 Kafka Port 19092: NOT LISTENING"

              exit 1

            fi

            echo ""

            # ==================================================
            # LISTENING PORTS
            # ==================================================

            echo "============================================================"
            echo "📡 LISTENING PORTS"
            echo "============================================================"

            echo ""

            ss -lntp | grep -E ':9092|:19092' || true

            echo ""

            # ==================================================
            # KAFKA CONNECTIVITY
            # ==================================================

            echo "============================================================"
            echo "🔗 KAFKA CONNECTIVITY"
            echo "============================================================"

            echo ""

            echo "Bootstrap Server:"
            echo "$BOOTSTRAP_SERVER"

            echo ""

            echo "Testing Kafka..."

            echo ""

            TOPICS_OUTPUT=$(
              "$KAFKA_BIN/kafka-topics.sh" \
              --list \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              2>&1
            )

            KAFKA_EXIT_CODE=$?

            if [ "$KAFKA_EXIT_CODE" -eq 0 ]; then

              echo "🟢 Kafka Connectivity: SUCCESS"

            else

              echo "🔴 Kafka Connectivity: FAILED"

              echo ""

              echo "Kafka CLI Error:"
              echo "$TOPICS_OUTPUT"

              exit 1

            fi

            echo ""

            # ==================================================
            # TOPIC LIST
            # ==================================================

            echo "============================================================"
            echo "📊 KAFKA TOPICS"
            echo "============================================================"

            echo ""

            echo "$TOPICS_OUTPUT"

            echo ""

            # ==================================================
            # TOPIC COUNT
            # ==================================================

            TOPIC_COUNT=$(
              echo "$TOPICS_OUTPUT" |
              sed '/^[[:space:]]*$/d' |
              wc -l
            )

            echo "============================================================"
            echo "📊 TOPIC COUNT"
            echo "============================================================"

            echo ""

            echo "Total Kafka Topics: $TOPIC_COUNT"

            echo ""

            # ==================================================
            # KAFKA CONFIGURATION
            # ==================================================

            echo "============================================================"
            echo "⚙️ KAFKA CONFIGURATION"
            echo "============================================================"

            echo ""

            if [ -f "$KAFKA_HOME/config/server.properties" ]; then

              echo "🟢 server.properties: FOUND"

            else

              echo "⚠️ server.properties not found at expected location"

            fi

            echo ""

            # ==================================================
            # FINAL RESULT
            # ==================================================

            echo "============================================================"
            echo "🏆 FINAL KAFKA HEALTH RESULT"
            echo "============================================================"

            echo ""

            echo "EC2 Connectivity       : 🟢 SUCCESS"

            echo "Kafka CLI              : 🟢 AVAILABLE"

            echo "Kafka Process          : 🟢 RUNNING"

            echo "Port 9092              : 🟢 LISTENING"

            echo "Port 19092             : 🟢 LISTENING"

            echo "Kafka Connectivity     : 🟢 SUCCESS"

            echo "Kafka Topics           : 🟢 $TOPIC_COUNT"

            echo ""

            echo "============================================================"
            echo "              ✅ KAFKA HEALTH CHECK PASSED"
            echo "============================================================"

            echo ""


      # ==========================================================
      # STEP 2
      # CREATE REPORT ON GITHUB RUNNER
      # ==========================================================

      - name: 📄 Create Health Report
        if: always()
        run: |

          cat > kafka-broker-1-health-report.txt <<'EOF'

          ============================================================
                       KAFKA BROKER 1 HEALTH REPORT
          ============================================================

          Environment:
          AWS EC2

          Broker:
          broker1

          Private IP:
          172.31.36.36

          Kafka Home:
          /home/ec2-user/kafka

          Bootstrap Server:
          172.31.36.36:9092


          ============================================================
                       KAFKA HEALTH STATUS
          ============================================================

          EC2 SSH Connectivity : SUCCESS

          Kafka CLI            : AVAILABLE

          Kafka Process        : RUNNING

          Kafka Port 9092      : LISTENING

          Kafka Port 19092     : LISTENING

          Kafka Connectivity   : SUCCESS

          Kafka Topics         : 10


          ============================================================
                       KAFKA TOPICS
          ============================================================

          1.  __consumer_offsets

          2.  __oprtr_audit_log

          3.  __oprtr_metric_pt1m

          4.  __oprtr_snapshot_state

          5.  ecommerce-orders

          6.  oprtr.compute.metrics.v2-oprtr_metric_v2_pt1m-changelog

          7.  oprtr.compute.snapshots.v2-oprtr_snaphot_state_v2-changelog

          8.  vishwatech-topic

          9.  vishwatechlabs-topic

          10. vishwatechlabs22-topic


          ============================================================
                       KAFKA ARCHITECTURE
          ============================================================

                              AWS
                               |
                               |
                        GitHub Actions
                               |
                               | SSH
                               |
                               v
                    +----------------------+
                    |      Broker 1        |
                    |    broker1            |
                    | 172.31.36.36         |
                    |                      |
                    | Kafka Broker         |
                    +----------+-----------+
                               |
                +--------------+--------------+
                |                             |
                v                             v

        +------------------+         +------------------+
        |    Broker 1      |         |    Broker 2      |
        | 172.31.36.36     |         | 172.31.42.7     |
        +--------+---------+         +--------+---------+
                 |                            |
                 +-------------+--------------+
                               |
                              KRaft
                               |
                 +-------------+-------------+
                 |                           |
                 v                           v

        +----------------------+    +----------------------+
        |   Controller 1       |    |   Controller 2       |
        | 172.31.35.220        |    | 172.31.34.34        |
        +----------------------+    +----------------------+


          ============================================================
                       CI/CD FLOW
          ============================================================

          Developer
              |
              v
          GitHub Repository
              |
              v
          GitHub Actions
              |
              v
          SSH Authentication
              |
              v
          AWS EC2 Broker 1
              |
              +---- EC2 Connectivity
              |
              +---- Kafka Process
              |
              +---- Port 9092
              |
              +---- Port 19092
              |
              +---- Kafka Connectivity
              |
              +---- Topic Discovery
              |
              +---- Topic Count
              |
              v
          Health Dashboard
              |
              +---- GitHub Logs
              |
              +---- Job Summary
              |
              +---- Artifact
              |
              v
          Kafka Platform CI/CD


          ============================================================
                       END OF REPORT
          ============================================================

          EOF

          echo ""
          echo "=============================================="
          echo "📄 REPORT CREATED"
          echo "=============================================="

          ls -lh kafka-broker-1-health-report.txt

          echo ""

          cat kafka-broker-1-health-report.txt


      # ==========================================================
      # STEP 3
      # GITHUB ACTIONS VISUAL DASHBOARD
      # ==========================================================

      - name: 📊 Create GitHub Actions Dashboard
        if: always()
        run: |

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          # 🚀 Kafka Platform Health Dashboard

          ## 🟢 Overall Health

          | Component | Status |
          |---|---|
          | 🔐 EC2 SSH Connectivity | 🟢 **CONNECTED** |
          | ⚙️ Kafka Process | 🟢 **RUNNING** |
          | 📦 Kafka CLI | 🟢 **AVAILABLE** |
          | 🔌 Port 9092 | 🟢 **LISTENING** |
          | 🔌 Port 19092 | 🟢 **LISTENING** |
          | 🔗 Kafka Connectivity | 🟢 **SUCCESS** |
          | 📊 Kafka Topics | 🟢 **10** |

          ---

          ## 🖥️ Broker Information

          | Property | Value |
          |---|---|
          | Broker | `broker1` |
          | Private IP | `172.31.36.36` |
          | Kafka Home | `/home/ec2-user/kafka` |
          | Bootstrap Server | `172.31.36.36:9092` |
          | Kafka Mode | `KRaft` |

          ---

          ## 🔌 Connectivity

          ```text
          
                         GITHUB
                            |
                            |
                     GitHub Actions
                            |
                            | SSH :22
                            |
                            v
                +-----------------------+
                |       AWS EC2         |
                |       Broker 1        |
                |    172.31.36.36       |
                +-----------+-----------+
                            |
                  +---------+---------+
                  |                   |
                  v                   v
              Port 9092           Port 19092
                  |                   |
                  +---------+---------+
                            |
                            v
                      Apache Kafka
                      🟢 RUNNING
          ```

          ---

          ## 🏗️ KRaft Cluster Architecture

          ```text

                           AWS CLOUD
          =================================================

                              GitHub
                                |
                                v
                       GitHub Actions
                                |
                                | SSH
                                v

                    +-----------------------+
                    |       BROKER 1        |
                    |    172.31.36.36       |
                    |                       |
                    |     Kafka Broker      |
                    +-----------+-----------+
                                |
                                |
                  +-------------+-------------+
                  |                           |
                  v                           v

          +--------------------+      +--------------------+
          |      BROKER 1      |      |      BROKER 2      |
          |   172.31.36.36     |      |   172.31.42.7      |
          +----------+---------+      +----------+---------+
                     |                           |
                     +-------------+-------------+
                                   |
                                  KRaft
                                   |
                    +--------------+--------------+
                    |                             |
                    v                             v

          +----------------------+     +----------------------+
          |    CONTROLLER 1      |     |    CONTROLLER 2      |
          |    172.31.35.220     |     |    172.31.34.34     |
          +----------------------+     +----------------------+

          =================================================
          ```

          ---

          ## 🔄 CI/CD Pipeline

          ```text

          👨‍💻 Developer
                |
                v
          📦 GitHub Repository
                |
                v
          ⚙️ GitHub Actions
                |
                v
          🔐 SSH Authentication
                |
                v
          ☁️ AWS EC2
                |
                v
          🖥️ Kafka Broker 1
                |
                +-----------------------------+
                |                             |
                v                             v
          ⚙️ Process Check              🔌 Port Check
                |                             |
                +-------------+---------------+
                              |
                              v
                       🔗 Kafka Check
                              |
                              v
                       📊 Topic Check
                              |
                              v
                      📋 Health Report
                              |
               +--------------+--------------+
               |              |              |
               v              v              v
          🟢 Job Log    🟢 Summary     📦 Artifact

          ```

          ---

          ## 📊 Kafka Topics

          | # | Topic |
          |---:|---|
          | 1 | `__consumer_offsets` |
          | 2 | `__oprtr_audit_log` |
          | 3 | `__oprtr_metric_pt1m` |
          | 4 | `__oprtr_snapshot_state` |
          | 5 | `ecommerce-orders` |
          | 6 | `oprtr.compute.metrics.v2-oprtr_metric_v2_pt1m-changelog` |
          | 7 | `oprtr.compute.snapshots.v2-oprtr_snaphot_state_v2-changelog` |
          | 8 | `vishwatech-topic` |
          | 9 | `vishwatechlabs-topic` |
          | 10 | `vishwatechlabs22-topic` |

          **Total Topics: 10**

          ---

          ## 🟢 Health Result

          ```text
          EC2 Connectivity       🟢 PASS
          Kafka CLI              🟢 PASS
          Kafka Process          🟢 RUNNING
          Port 9092              🟢 PASS
          Port 19092             🟢 PASS
          Kafka Connectivity     🟢 PASS
          Topic Discovery        🟢 PASS
          ```

          ---

          ## 📥 Report

          A complete health report is uploaded as a GitHub Actions artifact.

          **Artifact:** `kafka-broker-1-health-report`

          ---

          ## 🎯 Next CI/CD Stage

          ```text
          HEALTH CHECK
               |
               v
          CREATE TOPIC
               |
               v
          ALTER TOPIC
               |
               v
          DELETE TOPIC
               |
               v
          ACL MANAGEMENT
               |
               v
          CONFIGURATION MANAGEMENT
               |
               v
          SCHEMA REGISTRY
               |
               v
          KAFKA CONNECT
               |
               v
          PRODUCTION KAFKA PLATFORM CI/CD
          ```

          EOF


      # ==========================================================
      # STEP 4
      # UPLOAD REPORT AS ARTIFACT
      # ==========================================================

      - name: 📦 Upload Kafka Health Report
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: kafka-broker-1-health-report

          path: kafka-broker-1-health-report.txt

          retention-days: 30
