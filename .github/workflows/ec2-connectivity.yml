name: Kafka Topic Management

on:
  workflow_dispatch:
    inputs:

      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - production

      topic_name:
        description: "Enter Kafka topic name"
        required: true
        type: string

      partitions:
        description: "Number of partitions"
        required: true
        type: string
        default: "3"

      replication_factor:
        description: "Replication factor"
        required: true
        type: string
        default: "2"

permissions:
  contents: read

jobs:

  kafka-topic-management:

    name: Kafka Topic Management

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STEP 1 - VALIDATE INPUTS
      # ============================================================

      - name: Validate Inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TOPIC_NAME: ${{ inputs.topic_name }}
          PARTITIONS: ${{ inputs.partitions }}
          REPLICATION_FACTOR: ${{ inputs.replication_factor }}

        run: |

          echo "=============================================="
          echo "        KAFKA CI/CD INPUT VALIDATION"
          echo "=============================================="

          echo ""
          echo "Environment:"
          echo "$ENVIRONMENT"

          echo ""
          echo "Topic Name:"
          echo "$TOPIC_NAME"

          echo ""
          echo "Partitions:"
          echo "$PARTITIONS"

          echo ""
          echo "Replication Factor:"
          echo "$REPLICATION_FACTOR"

          # --------------------------------------------------------
          # Validate topic name
          # --------------------------------------------------------

          if [ -z "$TOPIC_NAME" ]; then
            echo ""
            echo "ERROR: Topic name cannot be empty."
            exit 1
          fi

          if [ ${#TOPIC_NAME} -gt 249 ]; then
            echo ""
            echo "ERROR: Topic name is too long."
            exit 1
          fi

          if ! echo "$TOPIC_NAME" | grep -Eq '^[a-zA-Z0-9._-]+$'; then
            echo ""
            echo "ERROR: Invalid topic name."
            echo "Allowed characters:"
            echo "letters, numbers, dot, underscore and hyphen"
            exit 1
          fi

          # --------------------------------------------------------
          # Validate partitions
          # --------------------------------------------------------

          if ! [[ "$PARTITIONS" =~ ^[0-9]+$ ]]; then
            echo ""
            echo "ERROR: Partitions must be a number."
            exit 1
          fi

          if [ "$PARTITIONS" -lt 1 ]; then
            echo ""
            echo "ERROR: Partitions must be greater than 0."
            exit 1
          fi

          # --------------------------------------------------------
          # Validate replication factor
          # --------------------------------------------------------

          if ! [[ "$REPLICATION_FACTOR" =~ ^[0-9]+$ ]]; then
            echo ""
            echo "ERROR: Replication factor must be a number."
            exit 1
          fi

          if [ "$REPLICATION_FACTOR" -lt 1 ]; then
            echo ""
            echo "ERROR: Replication factor must be greater than 0."
            exit 1
          fi

          # Current Kafka cluster has 2 brokers

          if [ "$REPLICATION_FACTOR" -gt 2 ]; then
            echo ""
            echo "ERROR: Current Kafka cluster has only 2 brokers."
            echo "Maximum replication factor is 2."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "        INPUT VALIDATION PASSED"
          echo "=============================================="

      # ============================================================
      # STEP 2 - CONNECT TO KAFKA BROKER
      # ============================================================

      - name: Connect to Kafka Broker 1
        id: kafka

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USERNAME }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22

          timeout: 30s

          command_timeout: 5m

          capture_stdout: true

          script: |

            echo "=================================================="
            echo "           KAFKA BROKER 1"
            echo "=================================================="

            KAFKA_HOME="/home/ec2-user/kafka"

            KAFKA_BIN="$KAFKA_HOME/bin"

            BOOTSTRAP_SERVER="172.31.36.36:9092"

            ENVIRONMENT="${{ inputs.environment }}"

            TOPIC_NAME="${{ inputs.topic_name }}"

            PARTITIONS="${{ inputs.partitions }}"

            REPLICATION_FACTOR="${{ inputs.replication_factor }}"

            # ======================================================
            # INPUT SUMMARY
            # ======================================================

            echo ""

            echo "ENVIRONMENT=$ENVIRONMENT"

            echo "TOPIC_NAME=$TOPIC_NAME"

            echo "PARTITIONS=$PARTITIONS"

            echo "REPLICATION_FACTOR=$REPLICATION_FACTOR"

            echo ""

            echo "BOOTSTRAP_SERVER=$BOOTSTRAP_SERVER"

            # ======================================================
            # SERVER INFORMATION
            # ======================================================

            echo ""
            echo "=================================================="
            echo "SERVER INFORMATION"
            echo "=================================================="

            echo ""

            echo "Hostname:"
            hostname

            echo ""

            echo "User:"
            whoami

            echo ""

            echo "Private IP:"
            hostname -i

            echo ""

            echo "Uptime:"
            uptime

            # ======================================================
            # KAFKA CLI
            # ======================================================

            echo ""
            echo "=================================================="
            echo "KAFKA CLI"
            echo "=================================================="

            if [ -f "$KAFKA_BIN/kafka-topics.sh" ]; then

              echo "KAFKA_CLI_STATUS=PASS"

            else

              echo "KAFKA_CLI_STATUS=FAIL"

              exit 1

            fi

            # ======================================================
            # KAFKA PROCESS
            # ======================================================

            echo ""
            echo "=================================================="
            echo "KAFKA PROCESS"
            echo "=================================================="

            KAFKA_PROCESS=$(pgrep -af "kafka.Kafka" | head -1 || true)

            if [ -n "$KAFKA_PROCESS" ]; then

              echo "KAFKA_PROCESS_STATUS=RUNNING"

              echo "KAFKA_PROCESS=$KAFKA_PROCESS"

            else

              echo "KAFKA_PROCESS_STATUS=NOT_RUNNING"

              exit 1

            fi

            # ======================================================
            # PORT 9092
            # ======================================================

            echo ""
            echo "=================================================="
            echo "PORT 9092"
            echo "=================================================="

            if ss -lnt | grep -q ':9092 '; then

              echo "PORT_9092_STATUS=LISTENING"

            else

              echo "PORT_9092_STATUS=NOT_LISTENING"

              exit 1

            fi

            # ======================================================
            # PORT 19092
            # ======================================================

            echo ""
            echo "=================================================="
            echo "PORT 19092"
            echo "=================================================="

            if ss -lnt | grep -q ':19092 '; then

              echo "PORT_19092_STATUS=LISTENING"

            else

              echo "PORT_19092_STATUS=NOT_LISTENING"

              exit 1

            fi

            # ======================================================
            # KAFKA CONNECTIVITY
            # ======================================================

            echo ""
            echo "=================================================="
            echo "KAFKA CONNECTIVITY"
            echo "=================================================="

            TOPICS=$(
              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --list \
                2>&1
            )

            KAFKA_EXIT=$?

            if [ "$KAFKA_EXIT" -eq 0 ]; then

              echo "KAFKA_CONNECTIVITY_STATUS=SUCCESS"

            else

              echo "KAFKA_CONNECTIVITY_STATUS=FAILED"

              echo ""

              echo "KAFKA_ERROR:"

              echo "$TOPICS"

              exit 1

            fi

            # ======================================================
            # CREATE TOPIC
            # ======================================================

            echo ""
            echo "=================================================="
            echo "CREATE KAFKA TOPIC"
            echo "=================================================="

            echo ""

            echo "Environment:"
            echo "$ENVIRONMENT"

            echo ""

            echo "Topic:"
            echo "$TOPIC_NAME"

            echo ""

            echo "Partitions:"
            echo "$PARTITIONS"

            echo ""

            echo "Replication Factor:"
            echo "$REPLICATION_FACTOR"

            # ======================================================
            # CHECK EXISTING TOPIC
            # ======================================================

            if echo "$TOPICS" | grep -Fxq "$TOPIC_NAME"; then

              echo ""

              echo "TOPIC_STATUS=ALREADY_EXISTS"

              echo "Topic already exists."

            else

              echo ""

              echo "Creating topic..."

              CREATE_OUTPUT=$(
                "$KAFKA_BIN/kafka-topics.sh" \
                  --bootstrap-server "$BOOTSTRAP_SERVER" \
                  --create \
                  --topic "$TOPIC_NAME" \
                  --partitions "$PARTITIONS" \
                  --replication-factor "$REPLICATION_FACTOR" \
                  2>&1
              )

              CREATE_EXIT=$?

              echo ""

              echo "$CREATE_OUTPUT"

              if [ "$CREATE_EXIT" -eq 0 ]; then

                echo "TOPIC_STATUS=CREATED"

              else

                echo "TOPIC_STATUS=CREATE_FAILED"

                echo "TOPIC_CREATE_ERROR=$CREATE_OUTPUT"

                exit 1

              fi

            fi

            # ======================================================
            # VERIFY TOPIC
            # ======================================================

            echo ""
            echo "=================================================="
            echo "VERIFY TOPIC"
            echo "=================================================="

            VERIFY_TOPIC=$(
              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --list |
                grep -Fx "$TOPIC_NAME" || true
            )

            if [ "$VERIFY_TOPIC" = "$TOPIC_NAME" ]; then

              echo "TOPIC_VERIFY_STATUS=SUCCESS"

              echo "VERIFIED_TOPIC=$VERIFY_TOPIC"

            else

              echo "TOPIC_VERIFY_STATUS=FAILED"

              exit 1

            fi

            # ======================================================
            # ALL TOPICS
            # ======================================================

            echo ""
            echo "=================================================="
            echo "ALL KAFKA TOPICS"
            echo "=================================================="

            ALL_TOPICS=$(
              "$KAFKA_BIN/kafka-topics.sh" \
                --bootstrap-server "$BOOTSTRAP_SERVER" \
                --list
            )

            echo ""

            echo "INDIVIDUAL TOPICS:"
            echo "--------------------------------------------------"

            while IFS= read -r topic
            do

              if [ -n "$topic" ]; then

                echo "TOPIC: $topic"

              fi

            done <<< "$ALL_TOPICS"

            # ======================================================
            # TOPIC COUNT
            # ======================================================

            TOPIC_COUNT=$(
              echo "$ALL_TOPICS" |
              sed '/^[[:space:]]*$/d' |
              wc -l
            )

            echo ""

            echo "TOTAL_TOPIC_COUNT=$TOPIC_COUNT"

            # ======================================================
            # TOPIC DETAILS
            # ======================================================

            echo ""
            echo "=================================================="
            echo "TOPIC DETAILS"
            echo "=================================================="

            "$KAFKA_BIN/kafka-topics.sh" \
              --bootstrap-server "$BOOTSTRAP_SERVER" \
              --describe \
              --topic "$TOPIC_NAME"

            # ======================================================
            # FINAL RESULT
            # ======================================================

            echo ""
            echo "=================================================="
            echo "KAFKA TOPIC MANAGEMENT PASSED"
            echo "=================================================="

            echo "ENVIRONMENT=$ENVIRONMENT"

            echo "TOPIC_NAME=$TOPIC_NAME"

            echo "PARTITIONS=$PARTITIONS"

            echo "REPLICATION_FACTOR=$REPLICATION_FACTOR"

            echo "TOPIC_STATUS=$([ -n "$VERIFY_TOPIC" ] && echo "SUCCESS" || echo "FAILED")"

            echo "TOPIC_COUNT=$TOPIC_COUNT"

      # ============================================================
      # STEP 3 - CREATE REPORT
      # ============================================================

      - name: Create Kafka Health Report
        if: always()

        env:

          SSH_OUTPUT: ${{ steps.kafka.outputs.stdout }}

        run: |

          echo "$SSH_OUTPUT" > kafka-broker-1-health-report.txt

          echo ""
          echo "========================================"
          echo "KAFKA HEALTH REPORT"
          echo "========================================"

          cat kafka-broker-1-health-report.txt

      # ============================================================
      # STEP 4 - GITHUB DASHBOARD
      # ============================================================

      - name: Create GitHub Dashboard
        if: always()

        env:

          SSH_OUTPUT: ${{ steps.kafka.outputs.stdout }}

          REQUESTED_TOPIC: ${{ inputs.topic_name }}

          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}

          REQUESTED_PARTITIONS: ${{ inputs.partitions }}

          REQUESTED_REPLICATION: ${{ inputs.replication_factor }}

        run: |

          TOPIC_COUNT=$(echo "$SSH_OUTPUT" | grep "^TOTAL_TOPIC_COUNT=" | cut -d= -f2)

          TOPIC_STATUS=$(echo "$SSH_OUTPUT" | grep "^TOPIC_STATUS=" | cut -d= -f2)

          TOPIC_VERIFY=$(echo "$SSH_OUTPUT" | grep "^TOPIC_VERIFY_STATUS=" | cut -d= -f2)

          KAFKA_CLI=$(echo "$SSH_OUTPUT" | grep "^KAFKA_CLI_STATUS=" | cut -d= -f2)

          KAFKA_PROCESS=$(echo "$SSH_OUTPUT" | grep "^KAFKA_PROCESS_STATUS=" | cut -d= -f2)

          PORT_9092=$(echo "$SSH_OUTPUT" | grep "^PORT_9092_STATUS=" | cut -d= -f2)

          PORT_19092=$(echo "$SSH_OUTPUT" | grep "^PORT_19092_STATUS=" | cut -d= -f2)

          KAFKA_CONNECTIVITY=$(echo "$SSH_OUTPUT" | grep "^KAFKA_CONNECTIVITY_STATUS=" | cut -d= -f2)

          # ========================================================
          # STATUS ICONS
          # ========================================================

          if [ "$KAFKA_CLI" = "PASS" ]; then
            CLI_ICON="🟢"
          else
            CLI_ICON="🔴"
          fi

          if [ "$KAFKA_PROCESS" = "RUNNING" ]; then
            PROCESS_ICON="🟢"
          else
            PROCESS_ICON="🔴"
          fi

          if [ "$PORT_9092" = "LISTENING" ]; then
            PORT_9092_ICON="🟢"
          else
            PORT_9092_ICON="🔴"
          fi

          if [ "$PORT_19092" = "LISTENING" ]; then
            PORT_19092_ICON="🟢"
          else
            PORT_19092_ICON="🔴"
          fi

          if [ "$KAFKA_CONNECTIVITY" = "SUCCESS" ]; then
            KAFKA_ICON="🟢"
          else
            KAFKA_ICON="🔴"
          fi

          if [ "$TOPIC_STATUS" = "CREATED" ] || [ "$TOPIC_STATUS" = "ALREADY_EXISTS" ]; then
            TOPIC_ICON="🟢"
          else
            TOPIC_ICON="🔴"
          fi

          if [ "$TOPIC_VERIFY" = "SUCCESS" ]; then
            VERIFY_ICON="🟢"
          else
            VERIFY_ICON="🔴"
          fi

          # ========================================================
          # DASHBOARD HEADER
          # ========================================================

          echo "# 🚀 Kafka Platform Dashboard" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🎯 Deployment Request" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🌎 Environment | **$REQUESTED_ENVIRONMENT** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 📝 Topic Name | **\`$REQUESTED_TOPIC\`** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🔢 Partitions | **$REQUESTED_PARTITIONS** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🔁 Replication Factor | **$REQUESTED_REPLICATION** |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # HEALTH
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🏥 Kafka Broker Health" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Component | Status |" >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🔐 EC2 SSH | 🟢 CONNECTED |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 📦 Kafka CLI | $CLI_ICON $KAFKA_CLI |" >> "$GITHUB_STEP_SUMMARY"

          echo "| ⚙️ Kafka Process | $PROCESS_ICON $KAFKA_PROCESS |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🔌 Port 9092 | $PORT_9092_ICON $PORT_9092 |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🔌 Port 19092 | $PORT_19092_ICON $PORT_19092 |" >> "$GITHUB_STEP_SUMMARY"

          echo "| 🔗 Kafka Connectivity | $KAFKA_ICON $KAFKA_CONNECTIVITY |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # TOPIC RESULT
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🆕 Topic Operation" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Result |" >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          echo "| Environment | **$REQUESTED_ENVIRONMENT** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Topic | **\`$REQUESTED_TOPIC\`** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Status | $TOPIC_ICON **$TOPIC_STATUS** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Verification | $VERIFY_ICON **$TOPIC_VERIFY** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Partitions | **$REQUESTED_PARTITIONS** |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Replication Factor | **$REQUESTED_REPLICATION** |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # ALL TOPICS
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📊 All Kafka Topics" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| # | Topic |" >> "$GITHUB_STEP_SUMMARY"

          echo "|---:|---|" >> "$GITHUB_STEP_SUMMARY"

          COUNTER=1

          echo "$SSH_OUTPUT" |
          sed -n '/^INDIVIDUAL TOPICS:/,/^TOTAL_TOPIC_COUNT=/p' |
          grep '^TOPIC: ' |
          sed 's/^TOPIC: //' |
          while IFS= read -r topic
          do

            echo "| $COUNTER | \`$topic\` |" >> "$GITHUB_STEP_SUMMARY"

            COUNTER=$((COUNTER + 1))

          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Total Topics: $TOPIC_COUNT**" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # CI/CD FLOW
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🔄 Kafka CI/CD Flow" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          echo 'Developer' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    v' >> "$GITHUB_STEP_SUMMARY"

          echo 'GitHub Repository' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    v' >> "$GITHUB_STEP_SUMMARY"

          echo 'GitHub Actions' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    +---- Environment' >> "$GITHUB_STEP_SUMMARY"

          echo '    |       dev / stage / production' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    +---- Topic Name' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    +---- Partitions' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    +---- Replication Factor' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    v' >> "$GITHUB_STEP_SUMMARY"

          echo 'SSH :22' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    v' >> "$GITHUB_STEP_SUMMARY"

          echo 'AWS EC2 Broker 1' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    v' >> "$GITHUB_STEP_SUMMARY"

          echo 'Kafka KRaft Cluster' >> "$GITHUB_STEP_SUMMARY"

          echo '    |' >> "$GITHUB_STEP_SUMMARY"

          echo '    v' >> "$GITHUB_STEP_SUMMARY"

          echo 'Topic Created / Verified' >> "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # STEP 5 - UPLOAD REPORT
      # ============================================================

      - name: Upload Kafka Health Report
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: kafka-broker-1-health-report

          path: kafka-broker-1-health-report.txt

          retention-days: 30
