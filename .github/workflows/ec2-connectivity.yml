            "$MESSAGE_KEY:$PRODUCER_MESSAGE" \

            "" \

            "JOB STATUS" \

            "$JOB_STATUS" \

            > "$REPORT"


          echo ""

          echo "Dashboard generated."

          echo "Report generated: $REPORT"


      # ================================================================
      # UPLOAD INTERMEDIATE REPORT
      #
      # This allows Job 11 to download the report created by Job 10.
      # ================================================================

      - name: Upload Dashboard Report

        uses: actions/upload-artifact@v4

        with:

          name: kafka-dashboard-report

          path: kafka-end-to-end-report.txt

          retention-days: 1

          if-no-files-found: error


  # ================================================================
  # 11 - UPLOAD FINAL REPORT
  # ================================================================

  upload-report:

    name: "11 - Upload Report"

    needs: dashboard

    if: always()

    runs-on: ubuntu-latest

    steps:


      - name: Download Dashboard Report

        uses: actions/download-artifact@v4

        with:

          name: kafka-dashboard-report

          path: ./report


      - name: Prepare Final Report

        run: |

          set -e

          echo "=================================================="

          echo "11 - UPLOAD KAFKA CI/CD REPORT"

          echo "=================================================="


          echo ""

          echo "Downloaded files:"

          find ./report -type f -maxdepth 2 -print


          echo ""

          echo "Report content:"

          echo "--------------------------------------------------"

          cat ./report/kafka-end-to-end-report.txt

          echo "--------------------------------------------------"


      - name: Upload Final Kafka Report

        uses: actions/upload-artifact@v4

        with:

          name: kafka-end-to-end-final-report

          path: ./report/kafka-end-to-end-report.txt

          retention-days: 30

          if-no-files-found: error
